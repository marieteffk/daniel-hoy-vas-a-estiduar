<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juegos de estudio con repaso espaciado para el Tema 2 (agenda electrónica y comunicación). Admite nuevos PDF.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Repaso Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600&display=swap">
<script>/* Aplica el color y el modo guardados antes del primer pintado. */
try { var raA = JSON.parse(localStorage.getItem('ra.accent') || 'null'), raM = JSON.parse(localStorage.getItem('ra.mode') || 'null'); if (typeof raA === 'string') document.documentElement.setAttribute('data-accent', raA); if (raM === 'light' || raM === 'dark') document.documentElement.setAttribute('data-theme', raM); } catch (e) { }</script>
<style>
/* Sistema visual: ver DISENO.md. Una columna de 720 px, papel, tinta y un acento elegido por el usuario.
   Orden y aire tipo Notion (líneas finas, sin cajas dentro de cajas) con lo amable de Duolingo (tipografía redondeada,
   botones con borde inferior en relieve, barras gruesas). Sin sombras difusas, degradados ni desenfoques. */
:root {
  --paper: #FBFAF7; --surface: #FFFFFF; --surface-2: #EFEDE7; --ink: #1E1D1A; --ink-2: #6F6B63; --line: #E3E0D8; --line-2: #C9C5BB;
  --ok: #1B6E45; --ok-soft: #E1F2E7; --ko: #B33628; --ko-soft: #F9E1DD; --warn: #8E5D0E; --warn-soft: #F4E6C6;
  --accent-l: #2B40D4; --accent-d: #9DA8FF; --accent-ink-l: #FFFFFF; --accent-ink-d: #0F1440;
  --accent: var(--accent-l); --accent-ink: var(--accent-ink-l);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--paper));
  --accent-edge: color-mix(in srgb, var(--accent) 72%, #000);
  --ink-edge: color-mix(in srgb, var(--ink) 72%, #000);
  --font-display: "Nunito", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-s: 10px; --r-m: 14px;
}
:root[data-accent="petroleo"] { --accent-l: #0E7C86; --accent-d: #4FC6CF; --accent-ink-d: #04282B; }
:root[data-accent="ciruela"] { --accent-l: #7A2E8E; --accent-d: #D39AE3; --accent-ink-d: #2B0F33; }
:root[data-accent="naranja"] { --accent-l: #B5500F; --accent-d: #F6A062; --accent-ink-d: #3A1A05; }
:root[data-accent="carbon"] { --accent-l: #1A1813; --accent-d: #ECE7DC; --accent-ink-d: #141311; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #191917; --surface: #212120; --surface-2: #2C2B28; --ink: #ECEAE4; --ink-2: #A5A198; --line: #363530; --line-2: #4F4D46;
    --ok: #63C994; --ok-soft: #17322A; --ko: #F28E7F; --ko-soft: #3D1F1B; --warn: #E4B45D; --warn-soft: #392E14;
    --accent: var(--accent-d); --accent-ink: var(--accent-ink-d); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #191917; --surface: #212120; --surface-2: #2C2B28; --ink: #ECEAE4; --ink-2: #A5A198; --line: #363530; --line-2: #4F4D46;
  --ok: #63C994; --ok-soft: #17322A; --ko: #F28E7F; --ko-soft: #3D1F1B; --warn: #E4B45D; --warn-soft: #392E14;
  --accent: var(--accent-d); --accent-ink: var(--accent-ink-d); color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.12; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 2.5rem; }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.375rem; }
p { margin: 0; }
b, strong { font-weight: 600; }
a { color: var(--accent); text-underline-offset: 3px; }
.ic { display: inline-flex; width: 24px; height: 24px; flex: 0 0 auto; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.app { max-width: 720px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: 64px; }

/* Cabecera y navegación */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; padding-top: 20px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.375rem; background: none; border: 0; padding: 0 0 16px; color: var(--ink); letter-spacing: -0.01em; }
.topTools { margin-left: auto; padding-bottom: 12px; display: flex; gap: 8px; position: relative; }
.nav { display: flex; gap: 2px; order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .nav { order: 0; width: auto; margin-left: 4px; } .topTools { order: 4; } }
.navItem { background: none; border: 0; padding: 8px 10px 14px; font-weight: 600; font-size: .9375rem; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .16s ease-out; }
.navItem:hover { color: var(--ink); }
.navItem.on { color: var(--ink); border-bottom-color: var(--ink); }
.iconBtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); color: var(--ink); padding: 0; }
.iconBtn:hover { border-color: var(--line-2); }
.themePanel { position: absolute; right: 0; top: calc(100% - 2px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 12px; min-width: 240px; }
.tpRow { display: grid; gap: 8px; }
.tpL { font-size: .8125rem; color: var(--ink-2); }
.swatches { display: flex; gap: 10px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--sw); }
.sw.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 7px 12px; font-size: .9375rem; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--paper); }

/* Botones y texto auxiliar */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: var(--r-s); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); background: var(--surface); color: var(--ink); font-weight: 600; line-height: 1.2; text-decoration: none; transition: border-color .16s ease-out, background .16s ease-out, color .16s ease-out, transform .08s ease-out, box-shadow .08s ease-out; }
.btn:hover { border-color: var(--line-2); box-shadow: 0 3px 0 var(--line-2); }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-edge); }
.btn.primary:hover { filter: brightness(1.06); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-edge); }
.btn.text { border-color: transparent; background: transparent; color: var(--ink-2); box-shadow: none; }
.btn.text:active:not([disabled]) { transform: none; }
.btn.text:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--ko); }
.btn.big { min-height: 54px; padding: 12px 22px; font-size: 1.0625rem; }
.btn.small { min-height: 38px; padding: 5px 12px; font-size: .9375rem; }
.btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink-edge); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.stack.tight { gap: 8px; }
.muted { color: var(--ink-2); }
.small { font-size: .9375rem; }
.label { font-size: .8125rem; color: var(--ink-2); }
.tag { font-size: .8125rem; font-weight: 600; color: var(--accent); }
.tag.warn { color: var(--warn); }
.kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.block { padding-top: 24px; border-top: 1px solid var(--line); margin-top: 32px; }
.h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page { padding-top: 32px; display: grid; gap: 16px; }
.page .h { margin-bottom: 0; align-items: center; flex-wrap: wrap; }
.empty { padding: 48px 0; display: grid; gap: 12px; }

/* Inicio */
.hero { padding: 40px 0 28px; display: grid; gap: 10px; }
.hero .sub { color: var(--ink-2); max-width: 56ch; }
.packPick { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 6px; max-width: 480px; }
select.packSel { width: 100%; min-width: 0; padding: 8px 12px; border: 2px solid var(--line); border-radius: var(--r-s); background: var(--surface); text-overflow: ellipsis; }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 24px 48px; align-items: center; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ledger .big { display: grid; gap: 2px; }
.ledger .n { font-family: var(--font-display); font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ledger .n small { font-size: .4em; margin-left: 2px; color: var(--ink-2); font-weight: 400; }
.ledger .l { font-size: .9375rem; color: var(--ink-2); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 8.5em 1fr; gap: 12px; align-items: center; font-size: .9375rem; }
.facts .k { color: var(--ink-2); }
.facts .v { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 12px; min-width: 0; }
.facts .v.due { color: var(--warn); }
.mini { flex: 1 1 60px; max-width: 120px; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease-out; }
.days { display: inline-flex; gap: 4px; }
.days i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); }
.days i.on { background: var(--accent); }
@media (max-width: 480px) { .ledger { grid-template-columns: 1fr; gap: 16px; } .facts li { grid-template-columns: 7.5em 1fr; } }
.cta { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; width: 100%; margin-top: 24px; padding: 18px 20px; border: 0; border-radius: var(--r-m); background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-edge); text-align: left; transition: filter .16s ease-out, transform .08s ease-out, box-shadow .08s ease-out; }
.cta:hover { filter: brightness(1.06); }
.cta:active { transform: translateY(4px); box-shadow: none; }
.cta .t { display: grid; gap: 2px; min-width: 0; }
.cta b { font-family: var(--font-display); font-size: 1.375rem; font-weight: 800; }
.cta .d { font-size: .9375rem; opacity: .85; }
.games { display: grid; grid-template-columns: 1fr; }
@media (min-width: 640px) { .games { grid-template-columns: 1fr 1fr; column-gap: 32px; } }
.game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; color: var(--ink); }
.game .t { display: grid; gap: 2px; min-width: 0; }
.game b { font-size: 1.0625rem; }
.game .d { font-size: .9375rem; color: var(--ink-2); }
.game .right { display: flex; align-items: center; gap: 10px; }
.game .rec { font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.game .chev { color: var(--ink-2); transition: transform .16s ease-out, color .16s ease-out; }
.game:hover:not([disabled]) .chev { color: var(--ink); transform: translateX(3px); }
.game[disabled] { opacity: .45; cursor: not-allowed; }
.secs { display: grid; gap: 10px; }
.sec { display: grid; grid-template-columns: minmax(120px, 1.2fr) 3fr auto; gap: 12px; align-items: center; font-size: .9375rem; }
.sec .pct { font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 3.5ch; text-align: right; }
.meter { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .3s ease-out; }
@media (max-width: 420px) { .sec { grid-template-columns: 1fr auto; row-gap: 6px; } .sec .meter { grid-column: 1 / -1; grid-row: 2; } .sec .pct { grid-column: 2; grid-row: 1; } }

/* Partida */
.shell { padding-top: 24px; }
.shellHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.shellTitle { font-family: var(--font-display); font-weight: 800; font-size: 1.375rem; }
.shellMeta { display: flex; align-items: center; gap: 14px; font-size: .9375rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.shellMeta .hot { color: var(--warn); font-weight: 600; }
.segs { display: flex; gap: 4px; height: 8px; margin-bottom: 28px; }
.segs i { flex: 1; background: var(--surface-2); border-radius: 4px; transition: background .3s ease-out; }
.segs i.done { background: var(--accent); }
.segs i.now { background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }
.body { display: grid; gap: 20px; align-content: start; min-height: 240px; }
.q { font-family: var(--font-display); font-weight: 700; font-size: 1.625rem; line-height: 1.25; letter-spacing: -0.01em; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 54px; padding: 12px 14px; border-radius: var(--r-s); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--line); background: var(--surface); transition: border-color .16s ease-out, background .16s ease-out, transform .08s ease-out, box-shadow .08s ease-out; }
.opt:hover:not([disabled]) { border-color: var(--line-2); box-shadow: 0 2px 0 var(--line-2); }
.opt:active:not([disabled]) { transform: translateY(2px); box-shadow: none; }
.opt .key { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.opt .txt { flex: 1 1 auto; min-width: 0; }
.opt .mark { flex: 0 0 auto; display: inline-flex; min-width: 18px; }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 2px 0 var(--ok); animation: pop .22s ease-out; }
@keyframes pop { 50% { transform: scale(1.015); } }
.opt.is-right .key { background: var(--ok); color: var(--paper); }
.opt.is-right .mark { color: var(--ok); }
.opt.is-wrong { border-color: var(--ko); background: var(--ko-soft); box-shadow: 0 2px 0 var(--ko); }
.opt.is-wrong .key { background: var(--ko); color: var(--paper); }
.opt.is-wrong .mark { color: var(--ko); }
.opt[disabled] { cursor: default; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.two .opt { min-height: 72px; font-size: 1.0625rem; font-weight: 600; }
@media (max-width: 380px) { .opts.two { grid-template-columns: 1fr; } }
.fb { display: none; margin-top: 4px; padding: 16px; border-radius: var(--r-m); gap: 12px 16px; align-items: center; }
.fb.show { display: grid; grid-template-columns: 1fr auto; animation: rise .2s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.fb.ok { background: var(--ok-soft); }
.fb.ko { background: var(--ko-soft); }
.fb .verdict { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.fb.ok .verdict { color: var(--ok); }
.fb.ko .verdict { color: var(--ko); }
.fb .why { font-size: .9375rem; margin-top: 4px; }
@media (max-width: 480px) { .fb.show { grid-template-columns: 1fr; } .fb .btn { width: 100%; } }

/* Completa el hueco */
.cloze { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.65; letter-spacing: -0.01em; }
.cloze input { width: 10ch; max-width: 100%; padding: 2px 8px; border: 0; border-bottom: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px 8px 0 0; font-family: var(--font-ui); font-size: 1.125rem; font-weight: 600; text-align: center; }
.cloze input.ok { border-color: var(--ok); background: var(--ok-soft); }
.cloze input.ko { border-color: var(--ko); background: var(--ko-soft); }
.hint { font-size: .9375rem; color: var(--ink-2); min-height: 1.4em; }

/* Empareja */
.pairs { display: grid; gap: 16px; }
.chipsWrap { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { padding: 8px 12px; border-radius: var(--r-s); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--line); background: var(--surface); font-weight: 600; font-size: .9375rem; transition: background .16s ease-out, border-color .16s ease-out, opacity .25s ease-out; }
.pchip:hover { border-color: var(--line-2); }
.pchip.is-sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pchip.is-done { opacity: .3; pointer-events: none; }
.pchip.is-wrong, .pdef.is-wrong { border-color: var(--ko); background: var(--ko-soft); animation: shake .3s ease; }
.defs { display: grid; gap: 8px; }
.pdef { text-align: left; padding: 10px 12px; border-radius: var(--r-s); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--line); background: var(--surface); font-size: .9375rem; display: flex; gap: 10px; align-items: center; transition: background .16s ease-out, border-color .16s ease-out, opacity .25s ease-out; }
.pdef:hover { border-color: var(--line-2); }
.pdef.is-done { opacity: .35; pointer-events: none; }
.pdef .ic { color: var(--ok); }
@keyframes shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }

/* Clasifica */
.counter { font-size: .9375rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.itemCard { background: var(--surface-2); border-radius: var(--r-m); padding: 28px 20px; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.25; text-align: center; min-height: 120px; display: grid; place-items: center; transition: background .2s ease-out, color .2s ease-out; }
.itemCard.ok { background: var(--ok-soft); color: var(--ok); }
.itemCard.ko { background: var(--ko-soft); color: var(--ko); }
.cats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.cats .btn { min-height: 56px; justify-content: flex-start; text-align: left; }
.cats .btn.is-right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.cats .btn.is-wrong { border-color: var(--ko); background: var(--ko-soft); box-shadow: 0 3px 0 var(--ko); }

/* Ordena */
.steps { display: grid; gap: 8px; }
.step { text-align: left; padding: 10px 12px; border-radius: var(--r-s); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--line); background: var(--surface); display: flex; gap: 12px; align-items: center; transition: border-color .16s ease-out, background .16s ease-out, opacity .2s ease-out; }
.step:hover:not([disabled]) { border-color: var(--line-2); }
.step .n { flex: 0 0 auto; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--surface-2); font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.step.picked { opacity: .4; }
.step.pos-ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 2px 0 var(--ok); }
.step.pos-ok .n { background: var(--ok); color: var(--paper); }
.step.pos-ko { border-color: var(--ko); background: var(--ko-soft); box-shadow: 0 2px 0 var(--ko); }
.step.pos-ko .n { background: var(--ko); color: var(--paper); }
.step[disabled] { cursor: default; }

/* Tarjetas */

    { id: "q9", sec: "s1", q: "¿Cuál es una ventaja propia de POP3 frente a IMAP?", options: ["Consultar los mensajes guardados sin conexión a Internet", "Acceder desde cualquier dispositivo sin instalar nada", "No perder los mensajes si el equipo se avería", "Que varias personas gestionen la cuenta desde distintos lugares"], a: 0, why: "Con POP3 los mensajes están en nuestro disco duro; las otras tres son ventajas de IMAP." },
    { id: "q10", sec: "s1", q: "¿Por qué cada vez se usa más IMAP, según el libro?", options: ["Por las conexiones más rápidas, los clientes web más potentes y los dispositivos móviles", "Porque POP3 ha dejado de funcionar", "Porque IMAP permite adjuntos más grandes", "Porque POP3 es de pago"], a: 0, why: "Hoy un profesional consulta el correo desde varios dispositivos y tenerlo centralizado en uno solo se percibe como una limitación." },
    { id: "q11", sec: "s1", q: "¿Qué diferencia al chat del correo electrónico?", options: ["Exige que todos los interlocutores estén conectados a la vez", "No permite adjuntar archivos", "No guarda el registro de la conversación", "Solo funciona en empresas"], a: 0, why: "La comunicación es instantánea. Hoy los chats ya guardan mensajes, adjuntan archivos y registran la conversación." },
    { id: "q12", sec: "s1", q: "¿Qué software fue pionero en videoconferencia, según el libro?", options: ["Skype", "Gmail", "Thunderbird", "Facebook"], a: 0, why: "Casi todos los chats incorporan videoconferencia; Skype fue el pionero." },
    { id: "q13", sec: "s1", q: "¿Cuál NO es una funcionalidad principal de la agenda electrónica?", options: ["Edición de imágenes", "Agenda de contactos", "Calendario", "Notas"], a: 0, why: "Las tres funcionalidades principales son contactos, calendario y notas." },
    { id: "q14", sec: "s1", q: "¿Qué diferencia una reunión de una cita?", options: ["En la reunión se invita a contactos y un planificador propone la mejor fecha", "La cita dura siempre todo el día", "La reunión no tiene hora", "La cita solo se usa para visitas médicas"], a: 0, why: "La reunión es una versión avanzada de la cita, con asistentes y planificador." },
    { id: "q15", sec: "s1", q: "¿Qué es una tarea en la agenda electrónica?", options: ["Un asunto pendiente que no va ligado necesariamente a un día concreto", "Una cita de día completo", "Una reunión con varios asistentes", "Una nota tomada durante una llamada"], a: 0, why: "Ejemplos del libro: recoger un paquete en Correos o volver sobre un mensaje sin responder." },
    { id: "q16", sec: "s1", q: "¿Qué componente de Microsoft Office se dedica a comunicaciones y agenda electrónica?", options: ["Outlook", "Word", "Access", "Publisher"], a: 0, why: "Outlook agrupa correo, contactos, calendario y tareas." },
    { id: "q17", sec: "s1", q: "¿Qué necesita Thunderbird para ofrecer agenda electrónica?", options: ["Instalar el complemento Lightning", "Nada, la incluye por defecto", "Comprar una licencia", "Tener Outlook instalado"], a: 0, why: "Thunderbird no trae agenda de serie; Lightning añade calendario y tareas." },
    { id: "q18", sec: "s1", q: "¿Cuándo surgió el correo electrónico?", options: ["En Estados Unidos en los años setenta, antes que Internet", "En los noventa, con la web", "Con la aparición de Gmail", "A la vez que el chat"], a: 0, why: "Su utilidad fue clave para la expansión de las redes." },
    { id: "q19", sec: "s2", q: "¿Qué ventaja tienen las etiquetas de Gmail sobre las carpetas?", options: ["Un mismo mensaje puede tener varias etiquetas", "Ocupan menos espacio en el servidor", "Se sincronizan con Outlook", "No se pueden borrar"], a: 0, why: "Con carpetas, un mensaje solo puede estar en un sitio; con etiquetas puede estar en varios a la vez." },
    { id: "q20", sec: "s2", q: "¿Qué hace Gmail al archivar un mensaje?", options: ["Lo oculta de la bandeja de entrada, pero sigue accesible en Todos o por búsqueda", "Lo elimina definitivamente", "Lo envía a Spam", "Lo marca como importante"], a: 0, why: "Archivar sirve para mantener la bandeja despejada sin perder nada." },
    { id: "q21", sec: "s2", q: "¿Quién decide la marca Importante (la flecha) en Gmail?", options: ["Gmail, deduciendo automáticamente la relevancia", "El usuario, al pulsar la estrella", "El remitente del mensaje", "El administrador del dominio"], a: 0, why: "La estrella (Destacados) la pone el usuario; Importante lo deduce Gmail." },
    { id: "q22", sec: "s2", q: "¿Para qué sirve el captcha al crear una cuenta?", options: ["Para impedir que programas creen cuentas de forma automatizada", "Para comprobar la fortaleza de la contraseña", "Para verificar la edad", "Para elegir el nombre de usuario"], a: 0, why: "Los spammers crean cuentas automáticamente; el captcha es ilegible para un OCR." },
    { id: "q23", sec: "s2", q: "¿Qué dos mecanismos ofrece Google para recuperar el acceso si olvidas la contraseña?", options: ["Una pregunta de seguridad y otra cuenta de correo", "Un captcha y un SMS", "Un chat y una llamada", "El DNI y el teléfono fijo"], a: 0, why: "El captcha y el SMS son las pruebas anti-robots, no la recuperación." },
    { id: "q24", sec: "s2", q: "¿Qué innovación de Gmail agrupa un mensaje y todas sus respuestas?", options: ["Las conversaciones", "Las etiquetas", "Los filtros", "Los borradores"], a: 0, why: "Es un hilo parecido a los foros de discusión." },
    { id: "q25", sec: "s2", q: "¿Qué permite un filtro en Gmail?", options: ["Realizar una acción automática sobre los mensajes que cumplen unos criterios", "Bloquear la publicidad", "Cambiar el tema visual", "Crear una lista de distribución"], a: 0, why: "Por ejemplo: archivar y etiquetar como Amigos todo lo que envíe un compañero." },
    { id: "q26", sec: "s2", q: "¿Por qué hubo polémica de privacidad con los anuncios de Gmail?", options: ["Porque se adaptan al contenido de nuestros mensajes", "Porque aparecen en el captcha", "Porque se envían por SMS", "Porque Gmail es de pago"], a: 0, why: "Son anuncios sensibles al contexto." },
    { id: "q27", sec: "s2", q: "¿Cuál es un consejo del libro para crear una contraseña segura?", options: ["Combinar texto, números, mayúsculas y símbolos (una a por @, una s por $)", "Usar el nombre de usuario", "Usar solo números", "Usar la fecha de nacimiento"], a: 0, why: "Mezclar tipos de caracteres hace la contraseña más difícil de adivinar." },
    { id: "q28", sec: "s3", q: "¿Qué diferencia hay entre CC y CCO?", options: ["Los destinatarios en CCO no aparecen listados para los demás", "CC es para adjuntos y CCO para texto", "CCO solo existe en Gmail", "No hay ninguna diferencia"], a: 0, why: "CCO es copia oculta: los demás receptores no ven a quién se envió." },
    { id: "q29", sec: "s3", q: "Al pulsar Responder a todos, ¿a quién NO se envía copia?", options: ["A los destinatarios que iban en copia oculta", "Al remitente", "A los que iban en CC", "Se envía a todos sin excepción"], a: 0, why: "Los destinatarios ocultos no figuran en el mensaje, así que no reciben la respuesta." },
    { id: "q30", sec: "s3", q: "¿Qué prefijo añade Outlook al asunto cuando reenvías un mensaje?", options: ["RV", "RE", "CC", "OK"], a: 0, why: "RV de reenviar; otros clientes escriben FWD (forward)." },
    { id: "q31", sec: "s3", q: "¿Qué prefijo añade Outlook al asunto al responder un mensaje?", options: ["RE", "RV", "FWD", "CCO"], a: 0, why: "RE de respuesta; RV es para los reenvíos." },
    { id: "q32", sec: "s3", q: "¿Qué es una lista de distribución?", options: ["Una dirección como empleados@miempresa.com que hace llegar el mensaje a todos sus miembros", "Una carpeta especial de Outlook", "Una etiqueta de Gmail", "Un tipo de filtro"], a: 0, why: "Agrupa muchas direcciones bajo un mismo nombre." },
    { id: "q33", sec: "s3", q: "¿Puede Outlook crear una lista de distribución?", options: ["No, es responsabilidad del proveedor; Outlook ofrece grupos de contactos", "Sí, desde la ficha Carpeta", "Sí, mediante una regla", "Solo con el complemento Lightning"], a: 0, why: "Un cliente no puede crear direcciones; el grupo de contactos logra algo parecido." },
    { id: "q34", sec: "s3", q: "¿Qué formato de redifusión de contenidos utiliza Outlook?", options: ["RSS", "PST", "CSV", "vCard"], a: 0, why: "RSS (Really Simple Syndication) es el formato más extendido." },
    { id: "q35", sec: "s3", q: "¿Qué hace la opción Seguimiento (la bandera) en Outlook?", options: ["Añade el mensaje a la lista de tareas para volver a él", "Lo reenvía automáticamente", "Lo marca como correo no deseado", "Lo imprime"], a: 0, why: "Nos recuerda que debemos volver a ese mensaje más adelante." },
    { id: "q36", sec: "s3", q: "Para configurar Gmail en Outlook, ¿qué hay que activar primero en Gmail?", options: ["El acceso POP en Reenvío y correo POP/IMAP", "El chat", "Las etiquetas", "Un filtro"], a: 0, why: "Outlook accede a la cuenta mediante POP3, así que Gmail debe permitirlo." },
    { id: "q37", sec: "s3", q: "Al usar POP3 con Gmail, ¿qué conviene indicar sobre los mensajes ya descargados?", options: ["Que Gmail los archive en lugar de borrarlos", "Que Gmail los borre", "Que Gmail los reenvíe", "Que Gmail los marque como spam"], a: 0, why: "Así siguen accesibles desde el correo web y no se pierde esa ventaja." },
    { id: "q38", sec: "s3", q: "¿Qué permite hacer Outlook con las firmas?", options: ["Una firma para mensajes nuevos y otra para respuestas y reenvíos", "Solo una firma por cuenta", "Firmas únicamente en texto plano", "Firmas solo con el tema Atardecer"], a: 0, why: "En Elegir firma predeterminada se escoge una para cada caso." },
    { id: "q39", sec: "s3", q: "¿Qué hace una regla de Outlook?", options: ["Aplica una acción (por ejemplo mover a una carpeta) a los mensajes que cumplen una condición", "Corrige la ortografía", "Comprime los adjuntos", "Crea contactos nuevos"], a: 0, why: "Con Opciones avanzadas hay muchas más condiciones y acciones, incluso imprimir." },
    { id: "q40", sec: "s3", q: "¿Cuál es la forma más vistosa de organizar los contactos en Outlook?", options: ["Como tarjetas de visita (vCard)", "Como lista de etiquetas", "Como calendario", "Como conversaciones"], a: 0, why: "Cambiar vista permite verlos también de forma más convencional (modo Lista)." },
    { id: "q41", sec: "s4", q: "¿Cómo se crea en Outlook una cita asociada a una tarea?", options: ["Arrastrando la tarea a un día del calendario", "Marcando la tarea como completada", "Con el botón Periodicidad", "No es posible"], a: 0, why: "Las tareas no se ven en el calendario, salvo que se arrastren a un día." },
    { id: "q42", sec: "s4", q: "¿Qué opción marca una cita que no va ligada a una hora, como un cumpleaños?", options: ["Todo el día", "Periodicidad", "Categorizar", "Aviso"], a: 0, why: "Las citas de todo el día aparecen en la parte superior de la vista Día." },
    { id: "q43", sec: "s4", q: "¿Para qué sirve la opción Periodicidad de una cita?", options: ["Para que el evento se repita cada cierto tiempo", "Para avisar antes del evento", "Para compartir el calendario", "Para invitar asistentes"], a: 0, why: "Por ejemplo, un cumpleaños con frecuencia anual e ilimitada." },
    { id: "q44", sec: "s4", q: "¿Qué indica el signo de admiración en una cita de Outlook?", options: ["Importancia alta", "Importancia baja", "Evento periódico", "Evento compartido"], a: 0, why: "La importancia baja se marca con una flecha hacia abajo." },
    { id: "q45", sec: "s4", q: "¿Se muestran las tareas en el calendario de Outlook?", options: ["No, tienen su propia sección; solo aparecen si se arrastran a un día", "Sí, siempre", "Solo las de categoría Trabajo", "Solo en la vista Mes"], a: 0, why: "Al arrastrar una tarea a un día se genera una cita asociada." },
    { id: "q46", sec: "s4", q: "¿Para qué sirve el grupo Administrar calendarios de Outlook?", options: ["Para monitorizar los calendarios de los miembros del equipo y crear grupos", "Para imprimir el calendario", "Para cambiar el zoom", "Para crear filtros"], a: 0, why: "El libro lo describe como útil para directivos." },
    { id: "q47", sec: "s4", q: "En la vista Mes con el nivel de detalle bajo, ¿qué se visualiza?", options: ["Solo los eventos que duran todo el día", "Todos los eventos", "Solo las reuniones", "Solo las tareas"], a: 0, why: "Un menú desplegable permite indicar el detalle de la vista Mes." },
    { id: "q48", sec: "s5", q: "¿Quién desarrolla Thunderbird?", options: ["La Fundación Mozilla, sin ánimo de lucro", "Microsoft", "Google", "OpenOffice"], a: 0, why: "La misma fundación que desarrolla el navegador Firefox." },
    { id: "q49", sec: "s5", q: "¿De qué cliente de correo desciende Thunderbird?", options: ["Del cliente de Netscape", "De Outlook Express", "De Windows Live Mail", "De Gmail"], a: 0, why: "El libro lo describe como descendiente del desaparecido cliente de Netscape." },
    { id: "q50", sec: "s5", q: "¿Dónde agrupa Thunderbird opciones como filtros, complementos e importación?", options: ["En el menú Herramientas", "En la ficha Archivo", "En Configuración", "En la barra de estado"], a: 0, why: "Herramientas reúne la configuración, los filtros, los complementos y la importación/exportación." },
    { id: "q51", sec: "s6", q: "¿Qué formato se usa mayoritariamente para importar y exportar contactos?", options: ["CSV", "PST", "RSS", "DOCX"], a: 0, why: "CSV (valores separados por comas) lo aceptan casi todos los gestores." },
    { id: "q52", sec: "s6", q: "¿Qué extensión tienen los archivos de datos que exporta Outlook?", options: ["PST", "CSV", "PDF", "EML"], a: 0, why: "Cada cliente usa su propio formato para los mensajes; el de Outlook es PST." },
    { id: "q53", sec: "s6", q: "¿Por qué no es necesario exportar como copia de seguridad en el correo web?", options: ["Porque esa tarea corresponde al proveedor", "Porque el correo web no se puede exportar", "Porque los mensajes caducan", "Porque ya se guardan en el PC"], a: 0, why: "Los mensajes están en el servidor del proveedor, que se encarga de las copias." },
    { id: "q54", sec: "s6", q: "¿Desde dónde se accede siempre a las opciones de impresión en Outlook?", options: ["Ficha Archivo, opción Imprimir", "Ficha Vista", "Ficha Carpeta", "Barra de estado"], a: 0, why: "Las opciones cambian según la sección (correo, calendario, contactos...)." },
    { id: "q55", sec: "s6", q: "¿Cómo se importan en Thunderbird los mensajes que teníamos en Outlook?", options: ["Con Herramientas > Importar, eligiendo Correo y el programa Outlook", "Copiando un archivo CSV", "Mediante una fuente RSS", "No es posible"], a: 0, why: "Un asistente lo hace de forma automática en pocos segundos." }
  ],
  tf: [
    { id: "t1", sec: "s1", s: "El correo electrónico surgió después de Internet.", a: false, why: "Surgió en los años setenta, antes que Internet, y su utilidad fue clave para la expansión de las redes." },
    { id: "t2", sec: "s1", s: "La arroba se lee en inglés at.", a: true, why: "Por eso una dirección se lee como «jseguragarrido en gmail.com»." },
    { id: "t3", sec: "s1", s: "Cualquier persona puede pedir gratis un buzón en dominios de proveedores como Gmail o Hotmail.", a: true, why: "Aunque algunos cobran por un buzón de mayor capacidad." },
    { id: "t4", sec: "s1", s: "Un particular puede crear su cuenta en el dominio ordenadoreslopez.com.", a: false, why: "Las cuentas de un dominio registrado solo las crea la empresa propietaria." },
    { id: "t5", sec: "s1", s: "La cabecera incluye información de trazabilidad que las autoridades pueden solicitar al servidor.", a: true, why: "Aunque no se muestra, permite rastrear el origen de un mensaje." },
    { id: "t6", sec: "s1", s: "Con POP3 los mensajes se organizan en carpetas dentro del servidor.", a: false, why: "Eso es IMAP. Con POP3 se descargan y se organizan en nuestro ordenador." },
    { id: "t7", sec: "s1", s: "Es posible acceder a la misma cuenta mediante IMAP y POP3.", a: true, why: "POP3 puede dejar una copia en el servidor para seguir accediendo por correo web." },
    { id: "t8", sec: "s1", s: "Con IMAP, si el equipo se avería no se pierden los mensajes.", a: true, why: "Están almacenados en el servidor." },
    { id: "t9", sec: "s1", s: "POP3 ha dejado de usarse por completo.", a: false, why: "Sigue siendo ampliamente utilizado, aunque relegado a la empresa." },
    { id: "t10", sec: "s1", s: "Los chats actuales guardan los mensajes aunque el destinatario esté desconectado.", a: true, why: "Es uno de los servicios propios del correo que el chat ha incorporado." },
    { id: "t11", sec: "s1", s: "A diferencia de la agenda de papel, la electrónica avisa cuando se acerca un evento.", a: true, why: "Es su gran ventaja respecto a la agenda en papel." },
    { id: "t12", sec: "s1", s: "Una cita permite invitar a contactos y usar un planificador.", a: false, why: "Eso corresponde a la reunión, que es la versión avanzada de la cita." },
    { id: "t13", sec: "s1", s: "LibreOffice incluye un componente equivalente a Outlook.", a: false, why: "Ni OpenOffice ni LibreOffice lo ofrecen; la alternativa libre es Thunderbird." },
    { id: "t14", sec: "s1", s: "Google Calendar es independiente de Gmail pero accesible desde la misma cuenta.", a: true, why: "Es la agenda electrónica de Google." },
    { id: "t15", sec: "s2", s: "Gmail es gratuito y no muestra anuncios.", a: false, why: "Es gratuito, pero incluye anuncios en la ventana principal y al leer mensajes." },
    { id: "t16", sec: "s2", s: "En Gmail, la sección Todos muestra también los mensajes archivados.", a: true, why: "Archivar oculta el mensaje de la bandeja, pero sigue en Todos." },
    { id: "t17", sec: "s2", s: "Facebook eliminó el asunto de sus mensajes porque mucha gente lo dejaba en blanco.", a: true, why: "O escribía un simple «hola»." },
    { id: "t18", sec: "s2", s: "Un menor de edad puede abrir una cuenta de Gmail sin restricciones.", a: false, why: "Google pide la fecha de nacimiento porque la legislación de Estados Unidos lo impide." },
    { id: "t19", sec: "s2", s: "En las tareas de Gmail, al marcar la casilla la tarea aparece tachada.", a: true, why: "Se considera realizada." },
    { id: "t20", sec: "s3", s: "Al responder a todos se envía copia también al destinatario oculto.", a: false, why: "Los destinatarios en CCO no figuran en el mensaje y no reciben la respuesta." },
    { id: "t21", sec: "s3", s: "Outlook organiza el correo con etiquetas, igual que Gmail.", a: false, why: "Outlook usa carpetas." },
    { id: "t22", sec: "s3", s: "Un mensaje de Gmail con dos etiquetas aparece en Outlook en dos carpetas.", a: true, why: "Outlook reproduce cada etiqueta como una carpeta." },
    { id: "t23", sec: "s3", s: "Llamar sindicación a la redifusión web es una traducción correcta del inglés.", a: false, why: "Es una traducción incorrecta del término syndication." },
    { id: "t24", sec: "s3", s: "Outlook ya no permite gestionar grupos de noticias (newsgroups).", a: true, why: "La redifusión de contenidos les restó protagonismo." },
    { id: "t25", sec: "s4", s: "Las tareas de Outlook se muestran automáticamente en el calendario.", a: false, why: "No se visualizan, salvo que se arrastren a un día para crear una cita asociada." },
    { id: "t26", sec: "s4", s: "La primera vez que se usa una categoría de color, Outlook pide un nombre.", a: true, why: "Por ejemplo, amarillo para Trabajo." },
    { id: "t27", sec: "s4", s: "Compartir el calendario sirve para planificar eventos en grupo.", a: true, why: "El grupo Compartir permite hacer público nuestro calendario." },
    { id: "t28", sec: "s5", s: "Thunderbird incluye agenda electrónica por defecto.", a: false, why: "Hay que instalar el complemento Lightning." },
    { id: "t29", sec: "s6", s: "Cada cliente de correo usa su propio formato para exportar mensajes.", a: true, why: "Por eso la operación puede complicarse; Outlook usa PST." },
    { id: "t30", sec: "s6", s: "Los contactos de Outlook se pueden importar en Gmail con un archivo CSV.", a: true, why: "Desde Contactos > Importar contactos." },
    { id: "t31", sec: "s6", s: "Las opciones de impresión de Outlook son las mismas en todas las secciones.", a: false, why: "Cambian según estemos en correo, calendario o contactos." }
  ],
  cloze: [
    { id: "c1", sec: "s1", text: "Una dirección de correo consta de dos elementos separados por el símbolo ___.", answer: "@", alt: ["arroba"], hint: "Se lee at en inglés" },
    { id: "c2", sec: "s1", text: "El correo electrónico sigue el modelo ___ and forward.", answer: "store", alt: [], hint: "Almacenamiento, en inglés" },
    { id: "c3", sec: "s1", text: "El cliente de correo corresponde al componente ___.", answer: "MUA", alt: ["mail user agent"], hint: "Tres letras, la del medio es U" },
    { id: "c4", sec: "s1", text: "Con el protocolo ___ los mensajes permanecen siempre en el servidor.", answer: "IMAP", alt: [], hint: "Es la base del correo web" },
    { id: "c5", sec: "s1", text: "El protocolo ___ descarga los mensajes al ordenador y los elimina del servidor.", answer: "POP3", alt: ["pop"], hint: "Fue el primero en utilizarse" },
    { id: "c6", sec: "s1", text: "El título del mensaje se llama ___.", answer: "asunto", alt: [], hint: "Traduce el inglés subject" },
    { id: "c7", sec: "s1", text: "Un evento al que se invita a contactos y que usa un planificador es una ___.", answer: "reunión", alt: ["reunion"], hint: "Versión avanzada de la cita" },
    { id: "c8", sec: "s1", text: "Un asunto pendiente que no va ligado a un día concreto es una ___.", answer: "tarea", alt: [], hint: "Tiene su propia sección en la agenda" },
    { id: "c9", sec: "s1", text: "En los noventa se popularizaron las agendas personales electrónicas llamadas ___.", answer: "PDA", alt: [], hint: "Tres letras" },
    { id: "c10", sec: "s5", text: "El complemento que añade agenda a Thunderbird se llama ___.", answer: "Lightning", alt: [], hint: "Relámpago, en inglés" },
    { id: "c11", sec: "s2", text: "Gmail organiza el correo con ___ en lugar de carpetas.", answer: "etiquetas", alt: ["etiqueta"], hint: "Un mensaje puede tener varias" },
    { id: "c12", sec: "s2", text: "Gmail agrupa un mensaje y sus respuestas en una ___.", answer: "conversación", alt: ["conversacion"], hint: "Parecido a un hilo de foro" },
    { id: "c13", sec: "s2", text: "El texto difícil de leer para un OCR que evita cuentas automáticas se llama ___.", answer: "captcha", alt: [], hint: "Prueba anti-robots" },
    { id: "c14", sec: "s2", text: "El correo no deseado se conoce como ___.", answer: "spam", alt: [], hint: "Cuatro letras" },
    { id: "c15", sec: "s3", text: "Los destinatarios en copia ___ no aparecen listados para los demás.", answer: "oculta", alt: ["cco"], hint: "CCO" },

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}

function normalizePack(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const p = {
    id: String(raw.id || ('pack-' + Date.now().toString(36))),
    title: String(raw.title || 'Tema sin título').slice(0, 120),
    subtitle: String(raw.subtitle || '').slice(0, 200),
    source: String(raw.source || '').slice(0, 160),
    builtin: !!raw.builtin,
    created: raw.created || Date.now(),
    sections: [], concepts: [], questions: [], tf: [], cloze: [], sort: [], order: [], explain: []
  };
  const secsRaw = Array.isArray(raw.sections) ? raw.sections : [];
  p.sections = secsRaw.map((s, i) => ({ id: (s && s.id) ? String(s.id) : 's' + (i + 1), name: String((s && (s.name || s.title)) || s || ('Sección ' + (i + 1))).slice(0, 60) })).filter(s => s.name);
  if (!p.sections.length) p.sections = [{ id: 's1', name: 'General' }];
  const secIndex = new Map(p.sections.map((s, i) => [s.id, s.id]));
  const secByName = new Map(p.sections.map(s => [norm(s.name), s.id]));
  const sec = (v) => {
    if (v == null) return p.sections[0].id;
    if (typeof v === 'number') return (p.sections[v] || p.sections[v - 1] || p.sections[0]).id;
    const s = String(v); if (secIndex.has(s)) return s;
    const n = secByName.get(norm(s)); if (n) return n;
    const num = parseInt(s, 10); if (!isNaN(num) && p.sections[num - 1]) return p.sections[num - 1].id;
    for (const [k, id] of secByName) { if (k && (norm(s).includes(k) || k.includes(norm(s)))) return id; }
    return p.sections[0].id;
  };
  const str = (v, max = 400) => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, max);
  const arr = (v) => Array.isArray(v) ? v : [];
  arr(raw.concepts).forEach((c, i) => { if (!c) return; const term = str(c.term || c.t, 90), def = str(c.def || c.d || c.definition); if (term && def) p.concepts.push({ id: 'k' + (i + 1), sec: sec(c.sec), term, def }); });
  arr(raw.questions).forEach((q, i) => {
    if (!q) return; const text = str(q.q || q.question, 300); let options = arr(q.options).map(o => str(o, 160)).filter(Boolean); let a = Number(q.a ?? q.answer ?? 0);
    if (typeof q.a === 'string' && isNaN(Number(q.a))) { const idx = options.findIndex(o => norm(o) === norm(q.a)); a = idx >= 0 ? idx : 0; }
    options = Array.from(new Set(options)); if (!text || options.length < 2 || !(a >= 0 && a < options.length)) return;
    p.questions.push({ id: 'q' + (i + 1), sec: sec(q.sec), q: text, options: options.slice(0, 5), a: Math.min(a, 4), why: str(q.why || q.explain || q.explanation, 300) });
  });
  arr(raw.tf).forEach((t, i) => { if (!t) return; const s = str(t.s || t.statement, 300); const a = typeof t.a === 'string' ? /^(v|true|verdadero|sí|si)/i.test(t.a) : !!(t.a ?? t.answer); if (s) p.tf.push({ id: 't' + (i + 1), sec: sec(t.sec), s, a, why: str(t.why || t.explain, 300) }); });
  arr(raw.cloze).forEach((c, i) => { if (!c) return; let text = str(c.text || c.t, 300); const answer = str(c.answer || c.a, 60); if (!text || !answer) return; if (!text.includes('___')) { const re = new RegExp(answer.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'); if (!re.test(text)) return; text = text.replace(re, '___'); } p.cloze.push({ id: 'c' + (i + 1), sec: sec(c.sec), text, answer, alt: arr(c.alt).map(x => str(x, 60)).filter(Boolean), hint: str(c.hint, 120) }); });
  arr(raw.sort).forEach((s, i) => { if (!s) return; const cats = arr(s.cats || s.categories).map(x => str(x, 60)).filter(Boolean).slice(0, 4); const items = arr(s.items).map(it => { if (!it) return null; const t = str(it.t || it.text, 160); let c = it.c ?? it.cat; if (typeof c === 'string' && isNaN(Number(c))) { const idx = cats.findIndex(x => norm(x) === norm(c)); c = idx; } c = Number(c); return (t && c >= 0 && c < cats.length) ? { t, c } : null; }).filter(Boolean); if (cats.length >= 2 && items.length >= 3) p.sort.push({ id: 's' + (i + 1), sec: sec(s.sec), title: str(s.title, 120) || 'Clasifica', cats, items }); });
  arr(raw.order).forEach((o, i) => { if (!o) return; const steps = arr(o.steps).map(x => str(x, 160)).filter(Boolean); if (steps.length >= 3) p.order.push({ id: 'o' + (i + 1), sec: sec(o.sec), title: str(o.title, 120) || 'Ordena los pasos', steps: steps.slice(0, 8) }); });
  arr(raw.explain).forEach((e, i) => { if (!e) return; const q = str(e.q || e.question, 300), model = str(e.model || e.answer || e.a, 700); if (q && model) p.explain.push({ id: 'e' + (i + 1), sec: sec(e.sec), q, model }); });
  const total = p.concepts.length + p.questions.length + p.tf.length + p.cloze.length + p.sort.length + p.order.length + p.explain.length;
  return total >= 4 ? p : null;
}

  if (!window.pdfjsLib) throw new Error('el lector de PDF no está disponible');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';

async function extractPdfText(file, onProgress) {
  const lib = await ensurePdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, disableFontFace: true, isEvalSupported: false, useSystemFonts: false }).promise;
  let out = '';
  for (let pn = 1; pn <= doc.numPages; pn++) {
    onProgress(pn, doc.numPages);
    const page = await doc.getPage(pn); const tc = await page.getTextContent();
    let line = ''; let lastY = null;
    for (const it of tc.items) {
      if (typeof it.str !== 'string') continue;
      const y = it.transform ? it.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 3) { out += line.trim() + '\n'; line = ''; }
      line += it.str; line += it.hasEOL ? '\n' : ' '; lastY = y;
    }
    out += line.trim() + '\n\n';
    page.cleanup && page.cleanup();

}

  const promptA = common + 'Devuelve ÚNICAMENTE un objeto JSON con esta forma exacta (sin comentarios ni texto fuera del JSON):\n{\n "sections": ["Nombre sección 1", "Nombre sección 2"],\n "concepts": [{"term": "Término", "def": "Definición breve y fiel al texto (1-2 frases)", "sec": "Nombre sección"}],\n "cloze": [{"text": "Frase del texto con la palabra clave sustituida por ___", "answer": "palabra clave (1-3 palabras)", "alt": ["variante aceptable"], "hint": "pista breve", "sec": "Nombre sección"}],\n "sort": [{"title": "¿X o Y?", "cats": ["X", "Y"], "items": [{"t": "frase que pertenece a una categoría", "c": 0}], "sec": "Nombre sección"}],\n "order": [{"title": "Nombre del procedimiento", "steps": ["paso 1", "paso 2", "paso 3", "paso 4"], "sec": "Nombre sección"}],\n "explain": [{"q": "¿Por qué ...?", "model": "Respuesta modelo de 2-4 frases", "sec": "Nombre sección"}]\n}\nCantidades: exactamente ' + S.k + ' concepts (los términos más importantes, con definiciones distintas entre sí), ' + S.c + ' cloze (la respuesta debe ser una palabra o expresión concreta, nunca una frase larga), ' + S.sort + ' sort (categorías del texto que se confundan entre sí, con 2 o 3 categorías y entre 5 y 10 items cada una, "c" es el índice de la categoría), ' + S.order + ' order (procedimientos o secuencias reales del texto con 4-7 pasos en orden correcto) y ' + S.e + ' explain (preguntas de porqué o de comparación). Si el texto no tiene procedimientos, devuelve "order": [].';
  const promptB = common + 'Devuelve ÚNICAMENTE un objeto JSON con esta forma exacta (sin comentarios ni texto fuera del JSON):\n{\n "sections": ["Nombre sección 1", "Nombre sección 2"],\n "questions": [{"q": "Pregunta", "options": ["correcta", "distractor plausible", "distractor plausible", "distractor plausible"], "a": 0, "why": "Explicación breve de por qué es la correcta", "sec": "Nombre sección"}],\n "tf": [{"s": "Afirmación", "a": true, "why": "Explicación breve", "sec": "Nombre sección"}]\n}\nCantidades: exactamente ' + S.q + ' questions repartidas entre las secciones (la opción correcta siempre en la posición 0 con "a": 0; los distractores deben ser plausibles para quien ha leído el tema a medias, nunca absurdos; evita preguntas sobre números de figura o detalles triviales) y ' + S.tf + ' tf (mitad verdaderas, mitad falsas; las falsas deben ser errores típicos de comprensión, no inventos evidentes).';

}
