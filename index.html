<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juegos de estudio aleatorios con repaso espaciado para el Tema 2 (agenda electrónica y comunicación). Admite nuevos PDF.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Repaso Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de 920px como máximo; cabecera fija con el selector de tema; cada juego es una tarjeta con barra de progreso arriba y panel de feedback abajo. */
:root {
  --bg: #F1F5F6;
  --surface: #FFFFFF;
  --surface-2: #E8EFF1;
  --ink: #13262E;
  --muted: #5B6E76;
  --border: #D3DDE1;
  --accent: #0E7C86;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9F0F2;
  --amber: #D98E12;
  --amber-soft: #FBEBCB;
  --good: #2A8A55;
  --good-soft: #DCF3E4;
  --bad: #CF4A4A;
  --bad-soft: #F9DEDE;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(19, 38, 46, .05), 0 10px 28px rgba(19, 38, 46, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E181D; --surface: #16242B; --surface-2: #1E303A; --ink: #E6EEF1; --muted: #98AAB2; --border: #2A3F49;
    --accent: #3FC1CB; --accent-ink: #06282B; --accent-soft: #143B40; --amber: #F2B84B; --amber-soft: #3C2E12;
    --good: #4CC27A; --good-soft: #143524; --bad: #F07373; --bad-soft: #44201F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E181D; --surface: #16242B; --surface-2: #1E303A; --ink: #E6EEF1; --muted: #98AAB2; --border: #2A3F49;
  --accent: #3FC1CB; --accent-ink: #06282B; --accent-soft: #143B40; --amber: #F2B84B; --amber-soft: #3C2E12;
  --good: #4CC27A; --good-soft: #143524; --bad: #F07373; --bad-soft: #44201F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
.app { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); text-decoration: none; background: none; border: 0; padding: 0; letter-spacing: -0.02em; }
.brand .logo { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 500; font-size: 1.1rem; }
.brand span:last-child { white-space: nowrap; }
.topRight { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topRight .btn { white-space: nowrap; }
@media (max-width: 440px) { .brand span:last-child { display: none; } select.packSel { max-width: 56vw; } }
select.packSel { max-width: 46vw; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); text-overflow: ellipsis; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-weight: 600; line-height: 1.2; transition: transform .08s ease, background .15s ease, border-color .15s ease; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.subtle { border-color: transparent; background: var(--surface-2); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.big { padding: 14px 22px; font-size: 1.05rem; }
.btn.small { padding: 6px 10px; font-size: .9rem; border-radius: 9px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

/* Tarjetas y texto auxiliar */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 600; letter-spacing: .01em; }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.stack.tight { gap: 8px; }

/* Inicio */
.hero { display: grid; gap: 6px; margin-bottom: 18px; }
.hero h1 { font-size: clamp(1.6rem, 4.5vw, 2.3rem); font-weight: 800; }
.hero .sub { color: var(--muted); max-width: 62ch; }
.hero .src { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ruleta { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; border: 0; text-align: left; width: 100%; box-shadow: var(--shadow); }
.ruleta .h { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; line-height: 1.15; }
.ruleta p { opacity: .9; }
.ruleta .go { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.ruleta:hover { filter: brightness(1.05); }
@media (max-width: 480px) { .ruleta { grid-template-columns: 1fr; } .ruleta .go { font-size: 2rem; } }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; margin-bottom: 24px; }
.game { display: grid; gap: 8px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color .15s ease, transform .08s ease; }
.game:hover { border-color: var(--accent); }
.game:active { transform: translateY(1px); }
.game .name { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; }
.game .desc { color: var(--muted); font-size: .92rem; }
.game .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.game .rec { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.game.disabled { opacity: .5; }
.secs { display: grid; gap: 8px; }
.sec { display: grid; grid-template-columns: minmax(120px, 1.3fr) 3fr auto; gap: 10px; align-items: center; font-size: .95rem; }
.sec .pct { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.meter i.amber { background: var(--amber); }
@media (max-width: 420px) { .sec { grid-template-columns: 1fr auto; } .sec .meter { grid-column: 1 / -1; } }
.homeLinks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* Juego */
.shell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.shell-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.shell-head .t { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: .78rem; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.hot { background: var(--amber-soft); color: var(--amber); }
.bar { height: 6px; background: var(--surface-2); }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.body { padding: 20px 16px 24px; min-height: 240px; display: grid; gap: 14px; align-content: start; }
.q { font-size: clamp(1.15rem, 2.6vw, 1.4rem); font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); transition: border-color .12s ease, background .12s ease; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { flex: 0 0 auto; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-right .key { background: var(--good); color: #fff; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.two .opt { justify-content: center; font-size: 1.1rem; padding: 18px; font-weight: 600; }
@media (max-width: 380px) { .opts.two { grid-template-columns: 1fr; } }
.fb { display: none; padding: 14px 16px; border-top: 1px solid var(--border); gap: 10px; align-items: start; }
.fb.show { display: grid; grid-template-columns: 1fr auto; }
.fb.ok { background: var(--good-soft); }
.fb.ko { background: var(--bad-soft); }
.fb .verdict { font-weight: 700; }
.fb.ok .verdict { color: var(--good); }
.fb.ko .verdict { color: var(--bad); }
.fb .why { font-size: .95rem; margin-top: 2px; }
@media (max-width: 480px) { .fb.show { grid-template-columns: 1fr; } .fb .btn { width: 100%; } }

/* Completa el hueco */
.cloze { font-size: clamp(1.1rem, 2.5vw, 1.35rem); font-weight: 600; line-height: 1.7; }
.cloze input { width: 10ch; max-width: 100%; padding: 2px 6px; border: 0; border-bottom: 3px solid var(--accent); background: var(--accent-soft); border-radius: 6px 6px 0 0; font-family: var(--font-mono); font-size: 1rem; text-align: center; }
.cloze input.ok { border-color: var(--good); background: var(--good-soft); }
.cloze input.ko { border-color: var(--bad); background: var(--bad-soft); }
.hint { font-size: .92rem; color: var(--muted); font-style: italic; }

/* Empareja */
.pairs { display: grid; gap: 12px; }
.chipsWrap { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: .95rem; transition: background .12s ease, border-color .12s ease, opacity .25s ease; }
.pchip.is-sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pchip.is-done { opacity: .3; pointer-events: none; }
.pchip.is-wrong, .pdef.is-wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s ease; }
.defs { display: grid; gap: 8px; }
.pdef { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: .95rem; transition: background .12s ease, border-color .12s ease, opacity .25s ease; }
.pdef:hover { border-color: var(--accent); }
.pdef.is-done { opacity: .3; pointer-events: none; }
.pdef.is-done::before { content: "✓ "; color: var(--good); }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }

/* Clasifica */
.itemCard { background: var(--surface-2); border-radius: var(--radius); padding: 22px 18px; font-size: 1.15rem; font-weight: 600; text-align: center; min-height: 96px; display: grid; place-items: center; transition: background .2s ease; }
.itemCard.ok { background: var(--good-soft); color: var(--good); }
.itemCard.ko { background: var(--bad-soft); color: var(--bad); }
.cats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.cats .btn { padding: 14px; }
.cats .btn.is-right { border-color: var(--good); background: var(--good-soft); }
.cats .btn.is-wrong { border-color: var(--bad); background: var(--bad-soft); }

/* Ordena */
.steps { display: grid; gap: 8px; }
.step { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-start; }
.step:hover:not([disabled]) { border-color: var(--accent); }
.step .n { flex: 0 0 auto; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.step.picked { opacity: .35; }
.step.pos-ok { border-color: var(--good); background: var(--good-soft); }
.step.pos-ok .n { background: var(--good); color: #fff; }
.step.pos-ko { border-color: var(--bad); background: var(--bad-soft); }
.step.pos-ko .n { background: var(--bad); color: #fff; }
.step[disabled] { cursor: default; }

/* Tarjetas */
.flash { perspective: 1200px; }
.flashCard { position: relative; min-height: 220px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; padding: 24px; text-align: center; transition: transform .4s ease; transform-style: preserve-3d; }
.flashCard .face { display: grid; gap: 8px; }
.flashCard .big { font-family: var(--font-display); font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 700; }
.flashCard .ans { font-size: 1.05rem; }
.flashCard.flipped { background: var(--accent-soft); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate .btn { padding: 14px 8px; flex-direction: column; gap: 2px; }
.rate .btn small { font-weight: 400; color: var(--muted); font-size: .78rem; }
.rate .btn.ko:hover { border-color: var(--bad); }
.rate .btn.ok:hover { border-color: var(--good); }
@media (max-width: 380px) { .rate { grid-template-columns: 1fr; } }
.boxes { display: flex; gap: 4px; align-items: center; }
.boxes i { width: 14px; height: 8px; border-radius: 3px; background: var(--surface-2); }
.boxes i.on { background: var(--accent); }

/* Explícalo */
textarea.answer { width: 100%; min-height: 110px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); resize: vertical; }
.model { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.model .eyebrow { color: var(--accent); }
.aiBox { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; white-space: pre-wrap; font-size: .95rem; }

/* Resumen */
.summary { display: grid; gap: 16px; }
.summaryTop { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { width: 110px; height: 110px; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .8s ease; }
.ring text { font-family: var(--font-display); font-weight: 800; font-size: 26px; fill: var(--ink); }
.summaryNums { display: grid; gap: 4px; }
.summaryNums .h { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.missed { display: grid; gap: 8px; }
.missed .m { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: .93rem; display: grid; gap: 2px; }
.missed .m b { font-weight: 600; }
@media (max-width: 420px) { .summaryTop { grid-template-columns: 1fr; justify-items: center; text-align: center; } }

/* Añadir tema */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px 16px; text-align: center; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; justify-items: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { max-width: 100%; min-width: 0; width: 100%; font-size: .95rem; }
input[type=file] { max-width: 100%; min-width: 0; }
textarea.src { width: 100%; min-height: 160px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-family: var(--font-mono); font-size: .85rem; resize: vertical; }
input.text { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.radios { display: grid; gap: 8px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.radio.on { border-color: var(--accent); background: var(--accent-soft); }
.radio.off { opacity: .55; cursor: not-allowed; }
.radio input { margin-top: 4px; }
.radio b { display: block; }
.radio span { font-size: .92rem; color: var(--muted); }
.sizes { display: inline-flex; gap: 6px; }
.sizes .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.prog { display: grid; gap: 6px; }
.log { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.preview { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); max-height: 120px; overflow: auto; white-space: pre-wrap; background: var(--surface-2); padding: 10px; border-radius: 10px; }
.packRow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
@media (max-width: 520px) { .packRow { grid-template-columns: 1fr; } }
.counts { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.notice { padding: 10px 12px; border-radius: 10px; background: var(--amber-soft); color: var(--ink); font-size: .92rem; }
.notice.bad { background: var(--bad-soft); }
.notice.good { background: var(--good-soft); }

/* Por qué */
.prose { max-width: 68ch; display: grid; gap: 12px; }
.prose h2 { font-size: 1.35rem; margin-top: 8px; }
.prose h3 { font-size: 1.05rem; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.principle { display: grid; gap: 6px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.principle .g { font-family: var(--font-mono); font-size: .75rem; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.sources { font-size: .9rem; }
.sources li { margin-bottom: 4px; }

/* Varios */

  concepts: [
    { id: "k1", sec: "s1", term: "Correo electrónico", def: "Método de intercambio de mensajes a través de cualquier red de ordenadores, incluida Internet. Un mismo mensaje puede enviarse a uno o más destinatarios." },
    { id: "k2", sec: "s1", term: "Nombre de usuario", def: "Parte de la dirección de correo situada antes de la @. Identifica un buzón concreto de una persona o entidad." },
    { id: "k3", sec: "s1", term: "Nombre de dominio", def: "Parte de la dirección de correo situada después de la @. Indica el proveedor en el que está registrado el buzón." },
    { id: "k4", sec: "s1", term: "Cabecera del mensaje", def: "Información de control del mensaje: remitente, destinatarios, fecha y hora de envío y asunto." },
    { id: "k5", sec: "s1", term: "Cuerpo del mensaje", def: "Parte del mensaje que contiene el texto. En ella también pueden adjuntarse archivos de todo tipo." },
    { id: "k6", sec: "s1", term: "Asunto", def: "Título del mensaje. Explica el tema que se va a tratar; traduce el inglés subject." },
    { id: "k7", sec: "s1", term: "Store and forward", def: "Modelo de funcionamiento del correo: el emisor envía el mensaje al servidor del destinatario, que lo almacena hasta que el cliente del destinatario lo solicita." },
    { id: "k8", sec: "s1", term: "Servidor de correo", def: "Gestiona los buzones de un proveedor. Incluye los componentes MTA y MDA." },
    { id: "k9", sec: "s1", term: "Cuenta de correo", def: "Buzón personal concedido y gestionado por el proveedor, al que se accede con un identificador de usuario y una contraseña." },
    { id: "k10", sec: "s1", term: "Cliente de correo", def: "Software con el que accedemos a la cuenta y gestionamos los mensajes. Es el componente MUA." },
    { id: "k11", sec: "s1", term: "IMAP", def: "Protocolo en el que los mensajes permanecen siempre en el servidor y se organizan allí en carpetas. Es la base del correo web." },
    { id: "k12", sec: "s1", term: "POP3", def: "Protocolo más antiguo: un cliente instalado descarga los mensajes al ordenador y los elimina del servidor." },
    { id: "k13", sec: "s1", term: "Mensajería instantánea", def: "Servicio de comunicación inmediata (chat) que exige que todos los interlocutores estén conectados al servidor a la vez." },
    { id: "k14", sec: "s1", term: "Videoconferencia", def: "Comunicación en tiempo real con vídeo y audio; Skype fue el software pionero. Apoya el teletrabajo y las colaboraciones con el extranjero." },
    { id: "k15", sec: "s1", term: "Agenda electrónica", def: "Herramienta para planificar y optimizar el tiempo. Reúne agenda de contactos, calendario y notas." },
    { id: "k16", sec: "s1", term: "Evento", def: "Cualquier suceso destacable del que queremos tomar nota en la agenda. Se distinguen dos tipos: citas y reuniones." },
    { id: "k17", sec: "s1", term: "Cita", def: "Evento básico que representa cualquier acontecimiento que requiere nuestra atención: una visita al médico, una comida de trabajo..." },
    { id: "k18", sec: "s1", term: "Reunión", def: "Versión avanzada de la cita: se invita a contactos de la libreta y un planificador propone la fecha más propicia para todos." },
    { id: "k19", sec: "s1", term: "Tarea", def: "Asunto pendiente que no queremos olvidar y que no va ligado necesariamente a un día concreto." },
    { id: "k20", sec: "s1", term: "PDA", def: "Agenda personal electrónica que se popularizó en los noventa. Hoy cualquier móvil o tableta cumple esa función." },
    { id: "k21", sec: "s2", term: "Etiqueta (Gmail)", def: "Método de organización del correo en Gmail. A diferencia de las carpetas, un mismo mensaje puede tener varias etiquetas." },
    { id: "k22", sec: "s2", term: "Conversación", def: "Agrupación de un mensaje y todas sus respuestas en un solo hilo, parecido a un foro. Fue una innovación de Gmail." },
    { id: "k23", sec: "s2", term: "Archivar", def: "Ocultar un mensaje de la bandeja de entrada sin borrarlo. Sigue accesible en la sección Todos o mediante la búsqueda." },
    { id: "k24", sec: "s2", term: "Filtro", def: "Regla que realiza una acción automática (etiquetar, archivar...) sobre todos los mensajes que cumplen unos criterios." },
    { id: "k25", sec: "s2", term: "Captcha", def: "Texto difícil de identificar por un reconocedor de caracteres (OCR). Impide que programas creen cuentas de forma automatizada." },
    { id: "k26", sec: "s2", term: "Spam", def: "Correo no deseado, la lacra del correo electrónico. Los proveedores bloquean las cuentas que lo envían." },
    { id: "k27", sec: "s2", term: "Destacados", def: "Sección de Gmail que reúne los mensajes a los que hemos añadido la estrella." },
    { id: "k28", sec: "s3", term: "CC (con copia)", def: "Destinatarios secundarios de un mensaje, visibles para todos los receptores." },
    { id: "k29", sec: "s3", term: "CCO (con copia oculta)", def: "Destinatarios que reciben el mensaje pero no aparecen listados para el resto de receptores." },
    { id: "k30", sec: "s3", term: "Responder a todos", def: "Respuesta que incluye también a los contactos que iban en copia en el mensaje original. No incluye a los destinatarios ocultos." },
    { id: "k31", sec: "s3", term: "Reenviar", def: "Enviar a otra persona un mensaje que hemos recibido. Outlook añade al asunto el prefijo RV; otros clientes escriben FWD." },
    { id: "k32", sec: "s3", term: "Regla (Outlook)", def: "Condición y acción que Outlook aplica automáticamente a los mensajes, por ejemplo mover a una carpeta los de cierto remitente." },
    { id: "k33", sec: "s3", term: "Seguimiento (bandera)", def: "Marca que añade un mensaje a la lista de tareas para recordarnos volver a él más adelante." },
    { id: "k34", sec: "s3", term: "Lista de distribución", def: "Conjunto de direcciones agrupadas bajo un mismo nombre, como empleados@miempresa.com. La crea el proveedor de correo, no el cliente." },
    { id: "k35", sec: "s3", term: "Grupo de contactos", def: "Alternativa que ofrece Outlook a la lista de distribución: agrupa contactos de la libreta para escribirles a todos a la vez." },
    { id: "k36", sec: "s3", term: "vCard", def: "Formato de tarjeta de visita que Outlook genera con los datos de un contacto y que puede incorporarse a la firma." },
    { id: "k37", sec: "s3", term: "Redifusión web", def: "Forma de publicación que permite suscribirse a una fuente y recibir notificaciones cuando se actualiza. Se la llama, incorrectamente, sindicación." },
    { id: "k38", sec: "s3", term: "RSS", def: "Really Simple Syndication: el formato de redifusión más extendido. Outlook agrupa las fuentes en su panel principal." },
    { id: "k39", sec: "s3", term: "Archivo de datos de Outlook", def: "Lugar donde Outlook unifica los mensajes de las cuentas POP3, las carpetas personales y las fuentes RSS." },
    { id: "k40", sec: "s3", term: "Firma", def: "Texto que se añade al final de los mensajes. Outlook permite una firma para mensajes nuevos y otra para respuestas y reenvíos." },
    { id: "k41", sec: "s4", term: "Periodicidad", def: "Opción de una cita que hace que el evento se repita cada cierto tiempo, por ejemplo cada año." },
    { id: "k42", sec: "s4", term: "Categoría", def: "Etiqueta de color que se asigna a un evento (Trabajo, Personal, Estudios, Ocio...) para identificar su tipo de un vistazo." },
    { id: "k43", sec: "s4", term: "Aviso", def: "Ventana que aparece cuando se acerca un evento de la agenda." },
    { id: "k44", sec: "s4", term: "Evento de todo el día", def: "Cita no asociada a una hora concreta, como un cumpleaños. En la vista Día aparece en la parte superior." },
    { id: "k45", sec: "s4", term: "Planificador", def: "Herramienta de las reuniones que accede a los calendarios de los implicados y propone la fecha más propicia para todos." },
    { id: "k46", sec: "s5", term: "Thunderbird", def: "Cliente de correo libre de la Fundación Mozilla, descendiente del cliente de Netscape y principal alternativa a Outlook." },
    { id: "k47", sec: "s5", term: "Lightning", def: "Complemento que añade la agenda electrónica (calendario y tareas) a Thunderbird." },
    { id: "k48", sec: "s5", term: "Carpetas locales", def: "Sección de Thunderbird similar al archivo de datos de Outlook, donde pueden agruparse todas las cuentas." },
    { id: "k49", sec: "s6", term: "CSV", def: "Valores separados por comas: formato aceptado mayoritariamente para importar y exportar contactos." },
    { id: "k50", sec: "s6", term: "PST", def: "Formato propio de Outlook para exportar e importar mensajes y calendarios." },
    { id: "k51", sec: "s6", term: "Exportar", def: "Sacar mensajes, contactos o calendario a un archivo. Sirve también como copia de seguridad." }
  ],
  questions: [
    { id: "q1", sec: "s1", q: "¿Qué dos elementos forman una dirección de correo electrónico?", options: ["Nombre de usuario y nombre de dominio", "Nombre y apellidos", "Asunto y cuerpo", "Servidor y cliente"], a: 0, why: "En jseguragarrido@gmail.com, el usuario va antes de la @ y el dominio después." },
    { id: "q2", sec: "s1", q: "En la dirección agarcia@gmail.com, ¿qué indica gmail.com?", options: ["El proveedor de correo en el que está registrado el buzón", "El buzón concreto de la persona", "El cliente de correo que usa", "El protocolo de acceso"], a: 0, why: "El dominio señala el proveedor; el nombre de usuario (agarcia) identifica el buzón." },
    { id: "q3", sec: "s1", q: "¿Cuál de estos datos NO forma parte de la cabecera de un mensaje?", options: ["Los archivos adjuntos", "El remitente", "La fecha y hora de envío", "El asunto"], a: 0, why: "Los adjuntos van en el cuerpo, junto con el texto." },
    { id: "q4", sec: "s1", q: "El correo electrónico sigue el modelo...", options: ["store and forward (almacenamiento y reenvío)", "peer to peer (entre iguales)", "de tiempo real", "de cliente único"], a: 0, why: "El servidor del destinatario almacena el mensaje y lo entrega cuando el cliente lo solicita." },
    { id: "q5", sec: "s1", q: "¿A quién envía realmente el emisor su mensaje?", options: ["Al servidor de correo del destinatario", "Directamente al ordenador del receptor", "A su propio cliente de correo", "A su proveedor de Internet"], a: 0, why: "A pesar de las apariencias, el mensaje no va directo al receptor: lo guarda su servidor de correo." },
    { id: "q6", sec: "s1", q: "En el modelo del libro, ¿qué componente es el cliente de correo?", options: ["MUA", "MTA", "MDA", "MSA"], a: 0, why: "MUA (Mail User Agent) es el cliente; MTA y MDA forman parte del servidor." },
    { id: "q7", sec: "s1", q: "Con el protocolo IMAP, los mensajes...", options: ["permanecen siempre en el servidor", "se descargan y se borran del servidor", "solo se reciben si el receptor está conectado", "se guardan únicamente en el disco duro"], a: 0, why: "Por eso con IMAP podemos acceder desde cualquier dispositivo y no perdemos nada si el equipo se avería." },
    { id: "q8", sec: "s1", q: "¿Qué protocolo requiere instalar un cliente como Outlook y descarga los mensajes al equipo?", options: ["POP3", "IMAP", "RSS", "HTTP"], a: 0, why: "POP3 fue el primero en utilizarse: descarga los mensajes y los elimina del servidor." },
    { id: "q9", sec: "s1", q: "¿Cuál es una ventaja propia de POP3 frente a IMAP?", options: ["Consultar los mensajes guardados sin conexión a Internet", "Acceder desde cualquier dispositivo sin instalar nada", "No perder los mensajes si el equipo se avería", "Que varias personas gestionen la cuenta desde distintos lugares"], a: 0, why: "Con POP3 los mensajes están en nuestro disco duro; las otras tres son ventajas de IMAP." },
    { id: "q10", sec: "s1", q: "¿Por qué cada vez se usa más IMAP, según el libro?", options: ["Por las conexiones más rápidas, los clientes web más potentes y los dispositivos móviles", "Porque POP3 ha dejado de funcionar", "Porque IMAP permite adjuntos más grandes", "Porque POP3 es de pago"], a: 0, why: "Hoy un profesional consulta el correo desde varios dispositivos y tenerlo centralizado en uno solo se percibe como una limitación." },
    { id: "q11", sec: "s1", q: "¿Qué diferencia al chat del correo electrónico?", options: ["Exige que todos los interlocutores estén conectados a la vez", "No permite adjuntar archivos", "No guarda el registro de la conversación", "Solo funciona en empresas"], a: 0, why: "La comunicación es instantánea. Hoy los chats ya guardan mensajes, adjuntan archivos y registran la conversación." },
    { id: "q12", sec: "s1", q: "¿Qué software fue pionero en videoconferencia, según el libro?", options: ["Skype", "Gmail", "Thunderbird", "Facebook"], a: 0, why: "Casi todos los chats incorporan videoconferencia; Skype fue el pionero." },
    { id: "q13", sec: "s1", q: "¿Cuál NO es una funcionalidad principal de la agenda electrónica?", options: ["Edición de imágenes", "Agenda de contactos", "Calendario", "Notas"], a: 0, why: "Las tres funcionalidades principales son contactos, calendario y notas." },
    { id: "q14", sec: "s1", q: "¿Qué diferencia una reunión de una cita?", options: ["En la reunión se invita a contactos y un planificador propone la mejor fecha", "La cita dura siempre todo el día", "La reunión no tiene hora", "La cita solo se usa para visitas médicas"], a: 0, why: "La reunión es una versión avanzada de la cita, con asistentes y planificador." },
    { id: "q15", sec: "s1", q: "¿Qué es una tarea en la agenda electrónica?", options: ["Un asunto pendiente que no va ligado necesariamente a un día concreto", "Una cita de día completo", "Una reunión con varios asistentes", "Una nota tomada durante una llamada"], a: 0, why: "Ejemplos del libro: recoger un paquete en Correos o volver sobre un mensaje sin responder." },
    { id: "q16", sec: "s1", q: "¿Qué componente de Microsoft Office se dedica a comunicaciones y agenda electrónica?", options: ["Outlook", "Word", "Access", "Publisher"], a: 0, why: "Outlook agrupa correo, contactos, calendario y tareas." },
    { id: "q17", sec: "s1", q: "¿Qué necesita Thunderbird para ofrecer agenda electrónica?", options: ["Instalar el complemento Lightning", "Nada, la incluye por defecto", "Comprar una licencia", "Tener Outlook instalado"], a: 0, why: "Thunderbird no trae agenda de serie; Lightning añade calendario y tareas." },
    { id: "q18", sec: "s1", q: "¿Cuándo surgió el correo electrónico?", options: ["En Estados Unidos en los años setenta, antes que Internet", "En los noventa, con la web", "Con la aparición de Gmail", "A la vez que el chat"], a: 0, why: "Su utilidad fue clave para la expansión de las redes." },
    { id: "q19", sec: "s2", q: "¿Qué ventaja tienen las etiquetas de Gmail sobre las carpetas?", options: ["Un mismo mensaje puede tener varias etiquetas", "Ocupan menos espacio en el servidor", "Se sincronizan con Outlook", "No se pueden borrar"], a: 0, why: "Con carpetas, un mensaje solo puede estar en un sitio; con etiquetas puede estar en varios a la vez." },
    { id: "q20", sec: "s2", q: "¿Qué hace Gmail al archivar un mensaje?", options: ["Lo oculta de la bandeja de entrada, pero sigue accesible en Todos o por búsqueda", "Lo elimina definitivamente", "Lo envía a Spam", "Lo marca como importante"], a: 0, why: "Archivar sirve para mantener la bandeja despejada sin perder nada." },
    { id: "q21", sec: "s2", q: "¿Quién decide la marca Importante (la flecha) en Gmail?", options: ["Gmail, deduciendo automáticamente la relevancia", "El usuario, al pulsar la estrella", "El remitente del mensaje", "El administrador del dominio"], a: 0, why: "La estrella (Destacados) la pone el usuario; Importante lo deduce Gmail." },
    { id: "q22", sec: "s2", q: "¿Para qué sirve el captcha al crear una cuenta?", options: ["Para impedir que programas creen cuentas de forma automatizada", "Para comprobar la fortaleza de la contraseña", "Para verificar la edad", "Para elegir el nombre de usuario"], a: 0, why: "Los spammers crean cuentas automáticamente; el captcha es ilegible para un OCR." },
    { id: "q23", sec: "s2", q: "¿Qué dos mecanismos ofrece Google para recuperar el acceso si olvidas la contraseña?", options: ["Una pregunta de seguridad y otra cuenta de correo", "Un captcha y un SMS", "Un chat y una llamada", "El DNI y el teléfono fijo"], a: 0, why: "El captcha y el SMS son las pruebas anti-robots, no la recuperación." },
    { id: "q24", sec: "s2", q: "¿Qué innovación de Gmail agrupa un mensaje y todas sus respuestas?", options: ["Las conversaciones", "Las etiquetas", "Los filtros", "Los borradores"], a: 0, why: "Es un hilo parecido a los foros de discusión." },
    { id: "q25", sec: "s2", q: "¿Qué permite un filtro en Gmail?", options: ["Realizar una acción automática sobre los mensajes que cumplen unos criterios", "Bloquear la publicidad", "Cambiar el tema visual", "Crear una lista de distribución"], a: 0, why: "Por ejemplo: archivar y etiquetar como Amigos todo lo que envíe un compañero." },
    { id: "q26", sec: "s2", q: "¿Por qué hubo polémica de privacidad con los anuncios de Gmail?", options: ["Porque se adaptan al contenido de nuestros mensajes", "Porque aparecen en el captcha", "Porque se envían por SMS", "Porque Gmail es de pago"], a: 0, why: "Son anuncios sensibles al contexto." },
    { id: "q27", sec: "s2", q: "¿Cuál es un consejo del libro para crear una contraseña segura?", options: ["Combinar texto, números, mayúsculas y símbolos (una a por @, una s por $)", "Usar el nombre de usuario", "Usar solo números", "Usar la fecha de nacimiento"], a: 0, why: "Mezclar tipos de caracteres hace la contraseña más difícil de adivinar." },
    { id: "q28", sec: "s3", q: "¿Qué diferencia hay entre CC y CCO?", options: ["Los destinatarios en CCO no aparecen listados para los demás", "CC es para adjuntos y CCO para texto", "CCO solo existe en Gmail", "No hay ninguna diferencia"], a: 0, why: "CCO es copia oculta: los demás receptores no ven a quién se envió." },
    { id: "q29", sec: "s3", q: "Al pulsar Responder a todos, ¿a quién NO se envía copia?", options: ["A los destinatarios que iban en copia oculta", "Al remitente", "A los que iban en CC", "Se envía a todos sin excepción"], a: 0, why: "Los destinatarios ocultos no figuran en el mensaje, así que no reciben la respuesta." },
    { id: "q30", sec: "s3", q: "¿Qué prefijo añade Outlook al asunto cuando reenvías un mensaje?", options: ["RV", "RE", "CC", "OK"], a: 0, why: "RV de reenviar; otros clientes escriben FWD (forward)." },
    { id: "q31", sec: "s3", q: "¿Qué prefijo añade Outlook al asunto al responder un mensaje?", options: ["RE", "RV", "FWD", "CCO"], a: 0, why: "RE de respuesta; RV es para los reenvíos." },
    { id: "q32", sec: "s3", q: "¿Qué es una lista de distribución?", options: ["Una dirección como empleados@miempresa.com que hace llegar el mensaje a todos sus miembros", "Una carpeta especial de Outlook", "Una etiqueta de Gmail", "Un tipo de filtro"], a: 0, why: "Agrupa muchas direcciones bajo un mismo nombre." },
    { id: "q33", sec: "s3", q: "¿Puede Outlook crear una lista de distribución?", options: ["No, es responsabilidad del proveedor; Outlook ofrece grupos de contactos", "Sí, desde la ficha Carpeta", "Sí, mediante una regla", "Solo con el complemento Lightning"], a: 0, why: "Un cliente no puede crear direcciones; el grupo de contactos logra algo parecido." },
    { id: "q34", sec: "s3", q: "¿Qué formato de redifusión de contenidos utiliza Outlook?", options: ["RSS", "PST", "CSV", "vCard"], a: 0, why: "RSS (Really Simple Syndication) es el formato más extendido." },
    { id: "q35", sec: "s3", q: "¿Qué hace la opción Seguimiento (la bandera) en Outlook?", options: ["Añade el mensaje a la lista de tareas para volver a él", "Lo reenvía automáticamente", "Lo marca como correo no deseado", "Lo imprime"], a: 0, why: "Nos recuerda que debemos volver a ese mensaje más adelante." },
    { id: "q36", sec: "s3", q: "Para configurar Gmail en Outlook, ¿qué hay que activar primero en Gmail?", options: ["El acceso POP en Reenvío y correo POP/IMAP", "El chat", "Las etiquetas", "Un filtro"], a: 0, why: "Outlook accede a la cuenta mediante POP3, así que Gmail debe permitirlo." },
    { id: "q37", sec: "s3", q: "Al usar POP3 con Gmail, ¿qué conviene indicar sobre los mensajes ya descargados?", options: ["Que Gmail los archive en lugar de borrarlos", "Que Gmail los borre", "Que Gmail los reenvíe", "Que Gmail los marque como spam"], a: 0, why: "Así siguen accesibles desde el correo web y no se pierde esa ventaja." },
    { id: "q38", sec: "s3", q: "¿Qué permite hacer Outlook con las firmas?", options: ["Una firma para mensajes nuevos y otra para respuestas y reenvíos", "Solo una firma por cuenta", "Firmas únicamente en texto plano", "Firmas solo con el tema Atardecer"], a: 0, why: "En Elegir firma predeterminada se escoge una para cada caso." },
    { id: "q39", sec: "s3", q: "¿Qué hace una regla de Outlook?", options: ["Aplica una acción (por ejemplo mover a una carpeta) a los mensajes que cumplen una condición", "Corrige la ortografía", "Comprime los adjuntos", "Crea contactos nuevos"], a: 0, why: "Con Opciones avanzadas hay muchas más condiciones y acciones, incluso imprimir." },
    { id: "q40", sec: "s3", q: "¿Cuál es la forma más vistosa de organizar los contactos en Outlook?", options: ["Como tarjetas de visita (vCard)", "Como lista de etiquetas", "Como calendario", "Como conversaciones"], a: 0, why: "Cambiar vista permite verlos también de forma más convencional (modo Lista)." },
    { id: "q41", sec: "s4", q: "¿Cómo se crea en Outlook una cita asociada a una tarea?", options: ["Arrastrando la tarea a un día del calendario", "Marcando la tarea como completada", "Con el botón Periodicidad", "No es posible"], a: 0, why: "Las tareas no se ven en el calendario, salvo que se arrastren a un día." },
    { id: "q42", sec: "s4", q: "¿Qué opción marca una cita que no va ligada a una hora, como un cumpleaños?", options: ["Todo el día", "Periodicidad", "Categorizar", "Aviso"], a: 0, why: "Las citas de todo el día aparecen en la parte superior de la vista Día." },
    { id: "q43", sec: "s4", q: "¿Para qué sirve la opción Periodicidad de una cita?", options: ["Para que el evento se repita cada cierto tiempo", "Para avisar antes del evento", "Para compartir el calendario", "Para invitar asistentes"], a: 0, why: "Por ejemplo, un cumpleaños con frecuencia anual e ilimitada." },
    { id: "q44", sec: "s4", q: "¿Qué indica el signo de admiración en una cita de Outlook?", options: ["Importancia alta", "Importancia baja", "Evento periódico", "Evento compartido"], a: 0, why: "La importancia baja se marca con una flecha hacia abajo." },
    { id: "q45", sec: "s4", q: "¿Se muestran las tareas en el calendario de Outlook?", options: ["No, tienen su propia sección; solo aparecen si se arrastran a un día", "Sí, siempre", "Solo las de categoría Trabajo", "Solo en la vista Mes"], a: 0, why: "Al arrastrar una tarea a un día se genera una cita asociada." },
    { id: "q46", sec: "s4", q: "¿Para qué sirve el grupo Administrar calendarios de Outlook?", options: ["Para monitorizar los calendarios de los miembros del equipo y crear grupos", "Para imprimir el calendario", "Para cambiar el zoom", "Para crear filtros"], a: 0, why: "El libro lo describe como útil para directivos." },
    { id: "q47", sec: "s4", q: "En la vista Mes con el nivel de detalle bajo, ¿qué se visualiza?", options: ["Solo los eventos que duran todo el día", "Todos los eventos", "Solo las reuniones", "Solo las tareas"], a: 0, why: "Un menú desplegable permite indicar el detalle de la vista Mes." },
    { id: "q48", sec: "s5", q: "¿Quién desarrolla Thunderbird?", options: ["La Fundación Mozilla, sin ánimo de lucro", "Microsoft", "Google", "OpenOffice"], a: 0, why: "La misma fundación que desarrolla el navegador Firefox." },
    { id: "q49", sec: "s5", q: "¿De qué cliente de correo desciende Thunderbird?", options: ["Del cliente de Netscape", "De Outlook Express", "De Windows Live Mail", "De Gmail"], a: 0, why: "El libro lo describe como descendiente del desaparecido cliente de Netscape." },
    { id: "q50", sec: "s5", q: "¿Dónde agrupa Thunderbird opciones como filtros, complementos e importación?", options: ["En el menú Herramientas", "En la ficha Archivo", "En Configuración", "En la barra de estado"], a: 0, why: "Herramientas reúne la configuración, los filtros, los complementos y la importación/exportación." },
    { id: "q51", sec: "s6", q: "¿Qué formato se usa mayoritariamente para importar y exportar contactos?", options: ["CSV", "PST", "RSS", "DOCX"], a: 0, why: "CSV (valores separados por comas) lo aceptan casi todos los gestores." },
    { id: "q52", sec: "s6", q: "¿Qué extensión tienen los archivos de datos que exporta Outlook?", options: ["PST", "CSV", "PDF", "EML"], a: 0, why: "Cada cliente usa su propio formato para los mensajes; el de Outlook es PST." },
    { id: "q53", sec: "s6", q: "¿Por qué no es necesario exportar como copia de seguridad en el correo web?", options: ["Porque esa tarea corresponde al proveedor", "Porque el correo web no se puede exportar", "Porque los mensajes caducan", "Porque ya se guardan en el PC"], a: 0, why: "Los mensajes están en el servidor del proveedor, que se encarga de las copias." },
    { id: "q54", sec: "s6", q: "¿Desde dónde se accede siempre a las opciones de impresión en Outlook?", options: ["Ficha Archivo, opción Imprimir", "Ficha Vista", "Ficha Carpeta", "Barra de estado"], a: 0, why: "Las opciones cambian según la sección (correo, calendario, contactos...)." },
    { id: "q55", sec: "s6", q: "¿Cómo se importan en Thunderbird los mensajes que teníamos en Outlook?", options: ["Con Herramientas > Importar, eligiendo Correo y el programa Outlook", "Copiando un archivo CSV", "Mediante una fuente RSS", "No es posible"], a: 0, why: "Un asistente lo hace de forma automática en pocos segundos." }
  ],
  tf: [
    { id: "t1", sec: "s1", s: "El correo electrónico surgió después de Internet.", a: false, why: "Surgió en los años setenta, antes que Internet, y su utilidad fue clave para la expansión de las redes." },
    { id: "t2", sec: "s1", s: "La arroba se lee en inglés at.", a: true, why: "Por eso una dirección se lee como «jseguragarrido en gmail.com»." },
    { id: "t3", sec: "s1", s: "Cualquier persona puede pedir gratis un buzón en dominios de proveedores como Gmail o Hotmail.", a: true, why: "Aunque algunos cobran por un buzón de mayor capacidad." },
    { id: "t4", sec: "s1", s: "Un particular puede crear su cuenta en el dominio ordenadoreslopez.com.", a: false, why: "Las cuentas de un dominio registrado solo las crea la empresa propietaria." },
    { id: "t5", sec: "s1", s: "La cabecera incluye información de trazabilidad que las autoridades pueden solicitar al servidor.", a: true, why: "Aunque no se muestra, permite rastrear el origen de un mensaje." },
    { id: "t6", sec: "s1", s: "Con POP3 los mensajes se organizan en carpetas dentro del servidor.", a: false, why: "Eso es IMAP. Con POP3 se descargan y se organizan en nuestro ordenador." },
    { id: "t7", sec: "s1", s: "Es posible acceder a la misma cuenta mediante IMAP y POP3.", a: true, why: "POP3 puede dejar una copia en el servidor para seguir accediendo por correo web." },
    { id: "t8", sec: "s1", s: "Con IMAP, si el equipo se avería no se pierden los mensajes.", a: true, why: "Están almacenados en el servidor." },
    { id: "t9", sec: "s1", s: "POP3 ha dejado de usarse por completo.", a: false, why: "Sigue siendo ampliamente utilizado, aunque relegado a la empresa." },
    { id: "t10", sec: "s1", s: "Los chats actuales guardan los mensajes aunque el destinatario esté desconectado.", a: true, why: "Es uno de los servicios propios del correo que el chat ha incorporado." },
    { id: "t11", sec: "s1", s: "A diferencia de la agenda de papel, la electrónica avisa cuando se acerca un evento.", a: true, why: "Es su gran ventaja respecto a la agenda en papel." },
    { id: "t12", sec: "s1", s: "Una cita permite invitar a contactos y usar un planificador.", a: false, why: "Eso corresponde a la reunión, que es la versión avanzada de la cita." },
    { id: "t13", sec: "s1", s: "LibreOffice incluye un componente equivalente a Outlook.", a: false, why: "Ni OpenOffice ni LibreOffice lo ofrecen; la alternativa libre es Thunderbird." },
    { id: "t14", sec: "s1", s: "Google Calendar es independiente de Gmail pero accesible desde la misma cuenta.", a: true, why: "Es la agenda electrónica de Google." },
    { id: "t15", sec: "s2", s: "Gmail es gratuito y no muestra anuncios.", a: false, why: "Es gratuito, pero incluye anuncios en la ventana principal y al leer mensajes." },
    { id: "t16", sec: "s2", s: "En Gmail, la sección Todos muestra también los mensajes archivados.", a: true, why: "Archivar oculta el mensaje de la bandeja, pero sigue en Todos." },
    { id: "t17", sec: "s2", s: "Facebook eliminó el asunto de sus mensajes porque mucha gente lo dejaba en blanco.", a: true, why: "O escribía un simple «hola»." },
    { id: "t18", sec: "s2", s: "Un menor de edad puede abrir una cuenta de Gmail sin restricciones.", a: false, why: "Google pide la fecha de nacimiento porque la legislación de Estados Unidos lo impide." },
    { id: "t19", sec: "s2", s: "En las tareas de Gmail, al marcar la casilla la tarea aparece tachada.", a: true, why: "Se considera realizada." },
    { id: "t20", sec: "s3", s: "Al responder a todos se envía copia también al destinatario oculto.", a: false, why: "Los destinatarios en CCO no figuran en el mensaje y no reciben la respuesta." },
    { id: "t21", sec: "s3", s: "Outlook organiza el correo con etiquetas, igual que Gmail.", a: false, why: "Outlook usa carpetas." },
    { id: "t22", sec: "s3", s: "Un mensaje de Gmail con dos etiquetas aparece en Outlook en dos carpetas.", a: true, why: "Outlook reproduce cada etiqueta como una carpeta." },
    { id: "t23", sec: "s3", s: "Llamar sindicación a la redifusión web es una traducción correcta del inglés.", a: false, why: "Es una traducción incorrecta del término syndication." },
    { id: "t24", sec: "s3", s: "Outlook ya no permite gestionar grupos de noticias (newsgroups).", a: true, why: "La redifusión de contenidos les restó protagonismo." },
    { id: "t25", sec: "s4", s: "Las tareas de Outlook se muestran automáticamente en el calendario.", a: false, why: "No se visualizan, salvo que se arrastren a un día para crear una cita asociada." },
    { id: "t26", sec: "s4", s: "La primera vez que se usa una categoría de color, Outlook pide un nombre.", a: true, why: "Por ejemplo, amarillo para Trabajo." },
    { id: "t27", sec: "s4", s: "Compartir el calendario sirve para planificar eventos en grupo.", a: true, why: "El grupo Compartir permite hacer público nuestro calendario." },
    { id: "t28", sec: "s5", s: "Thunderbird incluye agenda electrónica por defecto.", a: false, why: "Hay que instalar el complemento Lightning." },
    { id: "t29", sec: "s6", s: "Cada cliente de correo usa su propio formato para exportar mensajes.", a: true, why: "Por eso la operación puede complicarse; Outlook usa PST." },
    { id: "t30", sec: "s6", s: "Los contactos de Outlook se pueden importar en Gmail con un archivo CSV.", a: true, why: "Desde Contactos > Importar contactos." },
    { id: "t31", sec: "s6", s: "Las opciones de impresión de Outlook son las mismas en todas las secciones.", a: false, why: "Cambian según estemos en correo, calendario o contactos." }
  ],
  cloze: [

    { id: "c13", sec: "s2", text: "El texto difícil de leer para un OCR que evita cuentas automáticas se llama ___.", answer: "captcha", alt: [], hint: "Prueba anti-robots" },
    { id: "c14", sec: "s2", text: "El correo no deseado se conoce como ___.", answer: "spam", alt: [], hint: "Cuatro letras" },
    { id: "c15", sec: "s3", text: "Los destinatarios en copia ___ no aparecen listados para los demás.", answer: "oculta", alt: ["cco"], hint: "CCO" },
    { id: "c16", sec: "s3", text: "Al reenviar un mensaje, Outlook añade al asunto el prefijo ___.", answer: "RV", alt: [], hint: "Dos letras; otros clientes usan FWD" },
    { id: "c17", sec: "s3", text: "Al responder un mensaje, Outlook añade al asunto el prefijo ___.", answer: "RE", alt: [], hint: "Dos letras" },

    { id: "c19", sec: "s3", text: "Outlook genera tarjetas de visita en formato ___.", answer: "vCard", alt: [], hint: "Empieza por v" },

    { id: "c21", sec: "s6", text: "Los archivos de datos de Outlook tienen la extensión ___.", answer: "PST", alt: [], hint: "Tres letras" },
    { id: "c22", sec: "s5", text: "Thunderbird es un cliente de correo desarrollado por la Fundación ___.", answer: "Mozilla", alt: [], hint: "La misma que hace Firefox" },
    { id: "c23", sec: "s4", text: "Para que una cita se repita cada cierto tiempo se usa la opción ___.", answer: "Periodicidad", alt: [], hint: "Por defecto está desactivada" },
    { id: "c24", sec: "s4", text: "Una cita sin hora concreta se marca con la casilla ___ el día.", answer: "Todo", alt: ["todo el dia", "todo el día"], hint: "Como un cumpleaños" },
    { id: "c25", sec: "s4", text: "La ventana que aparece cuando se acerca un evento se llama ___.", answer: "aviso", alt: [], hint: "Cinco letras" },

/* ===================== Lanzador ===================== */
function chunk(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }
function matchGroups(p, rounds, size) {
  const chosen = pick(p.concepts, Math.min(p.concepts.length, rounds * size));
  // Agrupa por sección cuando se puede, para que convivan conceptos parecidos (más difícil y más útil).
  const bySec = new Map(); chosen.forEach(k => { if (!bySec.has(k.sec)) bySec.set(k.sec, []); bySec.get(k.sec).push(k); });
  const ordered = [...bySec.values()].flat();
  return chunk(ordered, size).filter(g => g.length >= 3).slice(0, rounds);
}
function startGame(key) {
  const p = pack();
  if (key === 'cards') return runCards();
  if (key === 'quiz') return runRounds({ key, title: 'Test rápido', rounds: pick(p.questions, Math.min(10, p.questions.length)).map(mcRound) });
  if (key === 'tf') return runRounds({ key, title: 'Verdadero o falso', rounds: pick(p.tf, Math.min(10, p.tf.length)).map(tfRound) });
  if (key === 'cloze') return runRounds({ key, title: 'Completa el hueco', rounds: pick(p.cloze, Math.min(8, p.cloze.length)).map(clozeRound) });
  if (key === 'match') return runRounds({ key, title: 'Empareja', rounds: matchGroups(p, 2, 6).map((g, i) => matchRound(g, 'ronda ' + (i + 1))) });
  if (key === 'sort') return runRounds({ key, title: 'Clasifica', rounds: pick(p.sort, Math.min(3, p.sort.length)).map(s => sortRound(s)) });
  if (key === 'order') return runRounds({ key, title: 'Ordena los pasos', rounds: pick(p.order, Math.min(3, p.order.length)).map(orderRound) });
  if (key === 'explain') return runRounds({ key, title: 'Explícalo', rounds: pick(p.explain, Math.min(3, p.explain.length)).map(explainRound) });
  if (key === 'mix') {
    const plan = [];
    const add = (type, n) => { for (let i = 0; i < n; i++) plan.push(type); };
    add('quiz', Math.min(3, p.questions.length)); add('cloze', Math.min(2, p.cloze.length)); add('tf', Math.min(2, p.tf.length));
    if (p.concepts.length >= 4) add('match', 1); add('sort', Math.min(1, p.sort.length)); add('order', Math.min(1, p.order.length)); add('explain', Math.min(1, p.explain.length)); if (p.concepts.length >= 4) add('cardq', 1);
    const types = shuffle(plan).slice(0, 12);
    if (!types.length) { toast('Este tema no tiene contenido suficiente.'); return renderHome(); }
    const used = { quiz: pick(p.questions, 3), cloze: pick(p.cloze, 2), tf: pick(p.tf, 2), sort: pick(p.sort, 1), order: pick(p.order, 1), explain: pick(p.explain, 1), concepts: pick(p.concepts, 8) };
    const rounds = []; const cursors = { quiz: 0, cloze: 0, tf: 0, sort: 0, order: 0, explain: 0 };
    for (const t of types) {
      if (t === 'quiz') rounds.push(withLabel(mcRound(used.quiz[cursors.quiz++]), 'Test'));
      else if (t === 'cloze') rounds.push(withLabel(clozeRound(used.cloze[cursors.cloze++]), 'Hueco'));
      else if (t === 'tf') rounds.push(withLabel(tfRound(used.tf[cursors.tf++]), 'Verdadero o falso'));
      else if (t === 'sort') rounds.push(withLabel(sortRound(used.sort[cursors.sort++], 5), 'Clasifica'));
      else if (t === 'order') rounds.push(withLabel(orderRound(used.order[cursors.order++]), 'Ordena'));
      else if (t === 'explain') rounds.push(withLabel(explainRound(used.explain[cursors.explain++]), 'Explícalo'));
      else if (t === 'match') rounds.push(withLabel(matchRound(used.concepts.slice(0, 4), ''), 'Empareja'));
      else if (t === 'cardq') { const k = used.concepts[used.concepts.length - 1]; rounds.push(withLabel(conceptMcRound(k, p), 'Concepto')); }
    }
    return runRounds({ key, title: 'Ruleta', rounds });
  }
}
function withLabel(round, label) { round.label = label; return round; }
function conceptMcRound(k, p) {
  // Pregunta tipo test construida al vuelo a partir de un concepto: definición → término.
  const others = sample(p.concepts.filter(x => x.id !== k.id && x.sec === k.sec), 3);
  while (others.length < 3) { const extra = p.concepts.find(x => x.id !== k.id && !others.includes(x)); if (!extra) break; others.push(extra); }
  const q = { id: k.id, sec: k.sec, q: '¿A qué concepto corresponde esta definición? «' + k.def + '»', options: [k.term, ...others.map(o => o.term)], a: 0, why: k.term + ': ' + k.def };
  return mcRound(q);
}

function confetti() {
  if (reducedMotion()) return;
  const c = $('#confetti'); const ctx = c.getContext('2d'); if (!ctx) return;
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const colors = [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), getComputedStyle(document.documentElement).getPropertyValue('--amber').trim(), getComputedStyle(document.documentElement).getPropertyValue('--good').trim()];
  const parts = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * 100, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, s: 6 + Math.random() * 6, r: Math.random() * Math.PI, col: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const tick = (t) => { ctx.clearRect(0, 0, c.width, c.height); for (const p of parts) { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); } if (t - t0 < 1800) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; } };
  requestAnimationFrame(tick);
}

  Object.entries(GEN_SIZES).forEach(([k, v]) => { const b = el('button', { class: 'btn small' + (st.size === k ? ' on' : ''), type: 'button', text: v.label }); b.addEventListener('click', () => { st.size = k; sizes.querySelectorAll('.btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); }); sizes.append(b); });
  const go = el('button', { class: 'btn primary big', type: 'button', text: 'Crear los juegos' });

/* ---- Lectura de PDF en el navegador (pdf.js desde cdnjs, cargado solo cuando hace falta) ---- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('no se pudo cargar el lector')); document.head.append(s); }); }
async function ensurePdfJs() {
  if (!window.pdfjsLib) { await loadScript(PDFJS + 'pdf.min.js'); }
  if (!window.pdfjsLib) throw new Error('el lector de PDF no está disponible');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function extractPdfText(file, onProgress) {
  const lib = await ensurePdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, disableFontFace: true, isEvalSupported: false, useSystemFonts: false }).promise;
  let out = '';
  for (let pn = 1; pn <= doc.numPages; pn++) {
    onProgress(pn, doc.numPages);
    const page = await doc.getPage(pn); const tc = await page.getTextContent();
    let line = ''; let lastY = null;
    for (const it of tc.items) {
      if (typeof it.str !== 'string') continue;
      const y = it.transform ? it.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 3) { out += line.trim() + '\n'; line = ''; }
      line += it.str; line += it.hasEOL ? '\n' : ' '; lastY = y;
    }
    out += line.trim() + '\n\n';
    page.cleanup && page.cleanup();
  }
  return out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
}

/* ---- Generación con Claude (capacidad sample) ---- */
async function generateWithClaude(text, title, sizeKey, signal, onStatus) {
  const S = GEN_SIZES[sizeKey]; const s = state.caps.sample;
  const common = 'Eres un profesor de formación profesional que prepara material de estudio en español a partir de un texto. Usa SOLO la información del texto; no inventes datos. Escribe en español claro, con la terminología del propio texto. Divide el contenido en entre 3 y 6 secciones con nombres cortos tomados de los títulos del texto y usa esos mismos nombres en el campo "sec" de cada elemento.\n\nTÍTULO DEL TEMA: ' + title + '\n\nTEXTO:\n"""\n' + text + '\n"""\n\n';
  const promptA = common + 'Devuelve ÚNICAMENTE un objeto JSON con esta forma exacta (sin comentarios ni texto fuera del JSON):\n{\n "sections": ["Nombre sección 1", "Nombre sección 2"],\n "concepts": [{"term": "Término", "def": "Definición breve y fiel al texto (1-2 frases)", "sec": "Nombre sección"}],\n "cloze": [{"text": "Frase del texto con la palabra clave sustituida por ___", "answer": "palabra clave (1-3 palabras)", "alt": ["variante aceptable"], "hint": "pista breve", "sec": "Nombre sección"}],\n "sort": [{"title": "¿X o Y?", "cats": ["X", "Y"], "items": [{"t": "frase que pertenece a una categoría", "c": 0}], "sec": "Nombre sección"}],\n "order": [{"title": "Nombre del procedimiento", "steps": ["paso 1", "paso 2", "paso 3", "paso 4"], "sec": "Nombre sección"}],\n "explain": [{"q": "¿Por qué ...?", "model": "Respuesta modelo de 2-4 frases", "sec": "Nombre sección"}]\n}\nCantidades: exactamente ' + S.k + ' concepts (los términos más importantes, con definiciones distintas entre sí), ' + S.c + ' cloze (la respuesta debe ser una palabra o expresión concreta, nunca una frase larga), ' + S.sort + ' sort (categorías del texto que se confundan entre sí, con 2 o 3 categorías y entre 5 y 10 items cada una, "c" es el índice de la categoría), ' + S.order + ' order (procedimientos o secuencias reales del texto con 4-7 pasos en orden correcto) y ' + S.e + ' explain (preguntas de porqué o de comparación). Si el texto no tiene procedimientos, devuelve "order": [].';
  const promptB = common + 'Devuelve ÚNICAMENTE un objeto JSON con esta forma exacta (sin comentarios ni texto fuera del JSON):\n{\n "sections": ["Nombre sección 1", "Nombre sección 2"],\n "questions": [{"q": "Pregunta", "options": ["correcta", "distractor plausible", "distractor plausible", "distractor plausible"], "a": 0, "why": "Explicación breve de por qué es la correcta", "sec": "Nombre sección"}],\n "tf": [{"s": "Afirmación", "a": true, "why": "Explicación breve", "sec": "Nombre sección"}]\n}\nCantidades: exactamente ' + S.q + ' questions repartidas entre las secciones (la opción correcta siempre en la posición 0 con "a": 0; los distractores deben ser plausibles para quien ha leído el tema a medias, nunca absurdos; evita preguntas sobre números de figura o detalles triviales) y ' + S.tf + ' tf (mitad verdaderas, mitad falsas; las falsas deben ser errores típicos de comprensión, no inventos evidentes).';
  onStatus('Claude está leyendo el texto y redactando los juegos. Suele tardar entre uno y dos minutos…');
  const opts = { signal, modelTier: 'default', cache: false };
  let chars = 0; const prog = () => onStatus('Claude está escribiendo… ' + chars.toLocaleString('es-ES') + ' caracteres generados.');
  const callA = s.json(promptA, Object.assign({}, opts, { onText: ({ delta }) => { chars += delta.length; prog(); } }));
  const callB = s.json(promptB, Object.assign({}, opts, { onText: ({ delta }) => { chars += delta.length; prog(); } }));
  const [ra, rb] = await Promise.allSettled([callA, callB]);

  const A = ra.status === 'fulfilled' && ra.value && typeof ra.value === 'object' ? ra.value : {};
  const B = rb.status === 'fulfilled' && rb.value && typeof rb.value === 'object' ? rb.value : {};
  const secNames = []; const seen = new Set();
  for (const n of [...(Array.isArray(A.sections) ? A.sections : []), ...(Array.isArray(B.sections) ? B.sections : [])]) { const k = norm(n); if (k && !seen.has(k)) { seen.add(k); secNames.push(String(n)); } }
  const partial = ra.status === 'rejected' ? 'test y verdadero/falso' : rb.status === 'rejected' ? 'conceptos, huecos, clasificaciones y secuencias' : null;
  if (partial) toast('Una de las dos partes falló; el tema se creó sin ' + (partial === 'test y verdadero/falso' ? 'conceptos ni huecos' : 'test ni V/F') + '.');
  return { sections: secNames.length ? secNames : ['General'], concepts: A.concepts, cloze: A.cloze, sort: A.sort, order: A.order, explain: A.explain, questions: B.questions, tf: B.tf, source: 'Generado con Claude a partir de ' + (title || 'un texto') };
}

/* ---- Generación automática sin Claude (heurística sobre el texto) ---- */
const STOP = new Set('para como pero porque aunque sobre entre desde hasta donde cuando mientras también además puede pueden permite permiten mediante través través según otros otras todos todas cada mismo misma mismos mismas este esta estos estas aquel aquella algún alguna muchos muchas poco pocos tanto tanta sino bien muy más menos siempre nunca ahora luego después antes entonces incluso solo sólo sólo hacer hace hacen tiene tienen tener forma formas parte partes caso casos ejemplo ejemplos nuestro nuestra nuestros nuestras suele suelen dentro fuera gran grande grandes nuevo nueva nuevos nuevas través cualquier cualquiera través'.split(/\s+/));
function heuristicPack(text, title, sizeKey) {
  const S = GEN_SIZES[sizeKey];
  const clean = text.replace(/\r/g, '').replace(/(\p{L})-\n(\p{Ll})/gu, '$1$2').replace(/[ \t]+/g, ' ');
  const lines = joinLines(clean.split('\n').map(l => l.trim()).filter(Boolean));

    if (/^\d{1,2}(\.\d{1,2})*\.\s+[A-ZÁÉÍÓÚÑ¿][^.]{3,70}$/.test(l) && !/^\d+\.\s+(Accede|Haz|Pulsa|Escribe|Crea|Añade|Selecciona|Abre|Prueba|Rellena|Escoge|Introduce|Establece|Supera|Archiva|Destaca|Practica|Elimina|Aplica|Inicia|Personaliza|Configura|Indica|Envía|Guarda|Responde|Reenvía|Compara|Activa|Organiza|Cambia|Agrega|Localiza|Obtén|Modifica|Exporta|Importa|Instala|Importa)/.test(l) && sections.length < 8) {
      const name = l.replace(/^\d{1,2}(\.\d{1,2})*\.?\s+/, '').trim(); const multi = /^\d{1,2}\.\d/.test(l);
      if (name.length <= 60 && (multi || !/[¿?…]/.test(name)) && !sections.some(s => norm(s.name) === norm(name)) && !/^(sabías|recuerda|actividades|claves)/i.test(name.replace(/^[¿¡]/, ''))) { sections.push({ id: 's' + (sections.length + 1), name: name.slice(0, 60) }); secPos.push(p); }
    }
  }
  if (!sections.length) { sections.push({ id: 's1', name: 'General' }); secPos.push(0); }
  const secAt = (p) => { let id = sections[0].id; for (let i = 0; i < secPos.length; i++) if (secPos[i] <= p) id = sections[i].id; return id; };
  const flat = lines.join('\n');
  // Definiciones "Término: definición."
  const concepts = []; const seenTerms = new Set();
  const reDef = /(?:^|\n|[.!?]\s)\s*(?:[-–•]\s*)?([A-ZÁÉÍÓÚÑ][^.:;!?\n()]{2,45}?):\s+([^\n]{25,260}?[.!?])(?=\s|$)/g; let m;
  while ((m = reDef.exec(flat)) && concepts.length < S.k * 2) { const term = m[1].trim(); const def = cap(m[2].trim()); if (/\d/.test(term) || term.split(' ').length > 4 || /^(Fig|Figura|Actividades|Actividad|Nota|Ejemplo|Pregunta|Paso|Caso)/i.test(term) || /^[a-záéíóú]/.test(def)) continue; if (seenTerms.has(norm(term))) continue; seenTerms.add(norm(term)); concepts.push({ term, def, sec: secAt(m.index), pos: m.index }); }
  // Definiciones "X es/son un ..."
  const reIs = /(?:^|\n|[.!?]\s)\s*(?:El|La|Los|Las|Un|Una)?\s?([A-ZÁÉÍÓÚÑ][\p{L}\-]+(?: [\p{L}\-]+){0,3}?)\s(?:es|son)\s((?:un|una|el|la|los|las|cualquier|aquel|aquella|una forma|un método|un conjunto)[^\n]{20,220}?[.!?])(?=\s|$)/gu;
  while ((m = reIs.exec(flat)) && concepts.length < S.k * 2) { const term = m[1].trim(); const def = term + ' es ' + m[2].trim(); if (seenTerms.has(norm(term)) || STOP.has(norm(term)) || term.length < 3) continue; seenTerms.add(norm(term)); concepts.push({ term, def, sec: secAt(m.index), pos: m.index }); }

  const chosen = spread(concepts, S.k);
  // Secuencias numeradas (1. 2. 3. ...)
  const order = []; let cur = []; let curTitle = ''; let lastHeading = ''; let wantTitle = false; let curSec = sections[0].id; let lpos = 0;
  const flush = () => { if (cur.length >= 4 && cur.filter(s => /[¿?]/.test(s)).length < cur.length / 2 && !/^actividades/i.test(curTitle)) order.push({ title: curTitle, steps: cur, sec: curSec }); cur = []; };
  for (const l of lines) {
    const mm = /^(\d{1,2})\.\s+(.{8,})$/.exec(l);
    if (mm && !isHeading(l)) { const n = parseInt(mm[1], 10); if (n === 1) { flush(); curTitle = lastHeading || 'Procedimiento ' + (order.length + 1); curSec = secAt(lpos); } if (n === cur.length + 1) cur.push(firstSentence(mm[2])); }
    else if (wantTitle && l.length > 10 && l.length < 120 && !/[.:]$/.test(l)) { lastHeading = l; wantTitle = false; }
    else if (l.length > 4 && l.length < 70 && /^[A-ZÁÉÍÓÚÑ]/.test(l) && !/[.:]$/.test(l)) { lastHeading = l; wantTitle = /^caso práctico\s*\d*$/i.test(l); }

  }
  flush();
  const orderOut = spread(order, S.order).map(o => ({ title: o.title.slice(0, 100), steps: o.steps.slice(0, 7), sec: o.sec }));
  // Huecos: una palabra clave de la definición
  const cloze = [];
  for (const k of shuffle(chosen)) { if (cloze.length >= S.c) break; const words = k.def.split(/\s+/); const cands = words.map((w, i) => ({ w: w.replace(/[^\p{L}\p{N}]/gu, ''), i })).filter(x => x.w.length >= 6 && !STOP.has(norm(x.w)) && norm(x.w) !== norm(k.term)); if (!cands.length) continue; const acr = cands.find(x => /^[A-Z0-9]{2,}$/.test(x.w)); const c = acr || cands.sort((a, b) => b.w.length - a.w.length)[0]; const txt = words.map((w, i) => i === c.i ? w.replace(c.w, '___') : w).join(' '); cloze.push({ text: txt, answer: c.w, hint: 'Tiene que ver con: ' + k.term, sec: k.sec }); }

  const tf = [];
  for (const k of shuffle(chosen)) { if (tf.length >= S.tf) break; const other = sample(chosen.filter(x => x !== k), 1)[0]; if (!other) break; if (tf.length % 2 === 0) tf.push({ s: k.term + ': ' + k.def, a: true, why: 'Es la definición que da el texto.', sec: k.sec }); else tf.push({ s: k.term + ': ' + other.def, a: false, why: 'Esa es la definición de ' + other.term + '. ' + k.term + ': ' + k.def, sec: k.sec }); }

  const bySec = new Map(); chosen.forEach(k => { if (!bySec.has(k.sec)) bySec.set(k.sec, []); bySec.get(k.sec).push(k); });
  for (const [sec, ks] of bySec) { if (sort.length >= S.sort) break; const cats = ks.filter(k => k.def.split(/[,;]| y /).length >= 2).slice(0, 3); if (cats.length < 2) continue; const items = []; const seenIt = new Set(); cats.forEach((k, ci) => { k.def.replace(/^[^ ]+ (es|son) /, '').split(/[,;.]| y /).map(s => s.trim()).filter(s => s.length >= 15 && s.length <= 110 && !(/\(/.test(s) && !/\)/.test(s))).slice(0, 4).forEach(t => { const key = norm(t); if (seenIt.has(key)) return; seenIt.add(key); items.push({ t: cap(t), c: ci }); }); }); if (items.length >= 4) sort.push({ title: '¿' + cats.map(c => c.term).join(' o ') + '?', cats: cats.map(c => c.term), items, sec }); }
  // Explícalo
  const explain = sample(chosen, S.e).map(k => ({ q: 'Explica con tus palabras qué es «' + k.term + '» y para qué sirve.', model: k.def, sec: k.sec }));
  return { sections, concepts: chosen.map(k => ({ term: k.term, def: k.def, sec: k.sec })), cloze, questions, tf, sort, order: orderOut, explain };
}
function firstSentence(s) { const m = /^(.{10,140}?[.!?])(\s|$)/.exec(s); return (m ? m[1] : s.slice(0, 140)).trim(); }
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
// Une las líneas partidas por el salto de página o de columna del PDF en frases completas.
const JOIN_TAIL = /\b(en|de|la|el|los|las|y|o|a|con|por|para|que|del|al|un|una|su|sus|se|lo|es|son|no|más|muy|como|sin|sobre|entre|desde|hasta|ni|e|u|cuyo|cuya|al|the)$/i;
const isHeading = (l) => /^\d{1,2}(\.\d{1,2})*\.\s+\S/.test(l) && l.length < 80 && !/[.:;]$/.test(l);
function joinLines(lines) {
  const out = [];
  for (const l of lines) {
    const prev = out[out.length - 1];
    const startsLow = /^[\p{Ll}(«"“¿¡]/u.test(l) || /^\d+[^.]/.test(l);
    const joinable = prev !== undefined && !/[.:;!?]$/.test(prev) && !/^\d{1,2}\.\s/.test(l) && (startsLow || /,$/.test(prev) || JOIN_TAIL.test(prev));
    // Un título numerado solo se une con la línea siguiente si esta empieza en minúscula (continuación real).
    if (joinable && (!isHeading(prev) || /^\p{Ll}/u.test(l))) out[out.length - 1] = prev + ' ' + l;

}
function spread(arr, n) { if (arr.length <= n) return arr.slice(); const out = []; const step = arr.length / n; for (let i = 0; i < n; i++) out.push(arr[Math.floor(i * step)]); return out; }
